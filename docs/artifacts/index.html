<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>이산하 · 송시야 청첩장</title>
  <!-- 글꼴 후보. 시안 확인용으로 여럿을 싣습니다. 확정되면 쓰는 것만 남깁니다 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;600&family=Hahmlet:wght@400;600&family=Song+Myung&family=Diphylleia&family=Grandiflora+One&family=Nanum+Pen+Script&family=Nanum+Brush+Script&family=Gaegu:wght@400;700&family=Hi+Melody&family=Gamja+Flower&family=Gowun+Dodum&family=Nanum+Gothic:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&family=Cormorant+Garamond:wght@500;600&family=Dancing+Script:wght@500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { box-sizing: border-box; }
    :root {
      --paper-bg: #F3ECDF;
      --paper: #FBF7EF;
      --ink: #2F2A25;
      --ink-soft: #4A423B;
      --muted: #7A6F63;
      --oak: #B98E5E;
      --rule: #EDE4D3;
      --font-name: 'Nanum Pen Script', 'Apple SD Gothic Neo', cursive;
      --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      --font-ui: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      --font-latin: 'Cormorant Garamond', Georgia, serif;
      --font-script: 'Dancing Script', 'Snell Roundhand', cursive;
    }
    html { color-scheme: light only; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0;
      background: #E9E1D2;
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      position: relative;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: var(--paper-bg);
      box-shadow: 0 0 40px -20px rgba(70, 48, 24, 0.5);
    }
    .block { position: relative; }
    .block--fixed { min-height: 100dvh; }

    /* 1. 커버 */
    #cover {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 24px 24px;
    }
    .cover-head { display: flex; flex-direction: column; align-items: center; }
    .eyebrow {
      font-family: var(--font-latin);
      font-size: 21px;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.4;
      white-space: nowrap;
    }
    .tagline { margin: 6px 0 0; font-family: var(--font-name); font-size: 21px; line-height: 1.5; color: var(--ink-soft); white-space: nowrap; }
    .popup {
      position: relative;
      margin-top: 24px;
      width: min(302px, 78vw);
      aspect-ratio: 302 / 470;
      max-height: calc(100dvh - 360px);
      border-radius: 16px;
      overflow: hidden;
      background: #E7DCC8;
      box-shadow: 0 24px 48px -20px rgba(70, 48, 24, 0.45);
    }
    .popup__hall { width: 100%; height: 100%; object-fit: cover; object-position: 50% 58%; display: block; }
    .popup__shadow {
      position: absolute; left: calc(50% + 10px); bottom: 12.5%;
      width: 50%; height: 26px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(70, 48, 24, 0.32), rgba(70, 48, 24, 0) 70%);
    }
    .popup__couple {
      position: absolute; left: calc(50% + 10px); bottom: 14%;
      height: 42.5%; width: auto; transform: translateX(-50%);
      filter: drop-shadow(0 8px 8px rgba(70, 48, 24, 0.3));
    }
    .popup__fade { position: absolute; inset: 0; border-radius: 16px; box-shadow: inset 0 0 36px 14px rgba(243, 236, 223, 0.55); pointer-events: none; }
    .names { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .names__name { font-family: var(--font-name); font-size: 36px; font-weight: 400; letter-spacing: 0.06em; line-height: 1.3; }
    .names__and { font-family: var(--font-ui); font-size: 13px; color: var(--muted); line-height: 1.4; }

    /* 2. 핵심 정보. 열린 봉투 일러스트 위 편지지에 날짜·시간·장소 */
    #info { display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .letter-card {
      position: relative;
      width: min(340px, 86vw, calc((100dvh - 80px) * 817 / 1438));
      aspect-ratio: 817 / 1438;
    }
    .letter-card__art { display: block; width: 100%; height: 100%; }
    .letter-card__text {
      position: absolute; left: 22%; right: 22%; top: 13%; height: 46%;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      text-align: center; font-size: 16px; line-height: 1.7; color: var(--ink-soft);
    }
    .letter-card__venue { font-size: 17px; font-weight: 500; color: var(--ink); }
    .letter-card__rule { width: 28px; height: 1px; background: var(--oak); margin: 12px 0; }

    /* 진입 장면. 리본으로 묶인 두 쪽 표지가 풀리고 좌우로 열리면, 안쪽에 표제가 떠오른 뒤 커버 자리로 옮겨 갑니다 */
    html.is-intro { overflow: hidden; }
    html.is-intro .cover-head { visibility: hidden; }
    #intro {
      position: fixed; inset: 0; z-index: 30;
      background: var(--paper-bg);
      transition: opacity 0.35s ease;
    }
    #intro.is-done { opacity: 0; pointer-events: none; }
    .inside { position: absolute; inset: 0; background: var(--paper-bg); }
    .gate { position: absolute; inset: 0; perspective: 1400px; }
    .gate__panel {
      position: absolute; top: 0; bottom: 0; width: 50%;
      background-color: #F7F2E8;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.36 0 0 0 0 0.27 0 0 0 0 0.14 0 0 0 0.12 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      backface-visibility: hidden;
      transition: transform 1.2s cubic-bezier(0.65, 0, 0.35, 1);
    }
    .gate__left { left: 0; transform-origin: 0 50%; box-shadow: inset -14px 0 26px -22px rgba(70, 48, 24, 0.35); border-right: 1px solid rgba(255, 255, 255, 0.7); }
    .gate__right { right: 0; transform-origin: 100% 50%; box-shadow: inset 14px 0 26px -22px rgba(70, 48, 24, 0.35); border-left: 1px solid rgba(70, 48, 24, 0.12); }
    #intro.is-opening .gate__left { transform: rotateY(-105deg); }
    #intro.is-opening .gate__right { transform: rotateY(105deg); }
    .gate__band {
      position: absolute; left: 0; right: 0; top: calc(52% - 18px); height: 36px;
      background: linear-gradient(180deg, #FDFAF4 0%, #F3ECDD 45%, #E6DCC8 100%);
      box-shadow: 0 6px 12px -6px rgba(70, 48, 24, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.8);
      transition: transform 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    #intro.is-untie .gate__left .gate__band { transform: translateX(-8px); }
    #intro.is-untie .gate__right .gate__band { transform: translateX(8px); }
    .bow {
      position: absolute; left: 50%; top: 52%; z-index: 3;
      width: 250px; height: 172px;
      transform: translate(-50%, -32%);
      filter: drop-shadow(0 10px 10px rgba(70, 48, 24, 0.28));
      pointer-events: none;
    }
    .bow * { transform-box: fill-box; transition: transform 0.9s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.7s ease 0.2s; }
    .bow__loop--l { transform-origin: 100% 50%; }
    .bow__loop--r { transform-origin: 0% 50%; }
    .bow__tail--l, .bow__tail--r { transform-origin: 50% 0%; }
    .bow__knot { transform-origin: 50% 50%; transition-delay: 0.35s, 0.45s; }
    #intro.is-untie .bow__loop--l { transform: scale(0.06, 0.45); opacity: 0; }
    #intro.is-untie .bow__loop--r { transform: scale(0.06, 0.45); opacity: 0; }
    #intro.is-untie .bow__tail--l { transform: rotate(-22deg) translate(-36px, 26px); opacity: 0; }
    #intro.is-untie .bow__tail--r { transform: rotate(22deg) translate(36px, 26px); opacity: 0; }
    #intro.is-untie .bow__knot { transform: scale(0.5); opacity: 0; }
    .gate__note {
      position: absolute; right: 22px; bottom: calc(24px + env(safe-area-inset-bottom));
      font-family: var(--font-script); font-size: 18px; font-weight: 500; line-height: 1.2;
      color: #7E5A33; transform: rotate(-4deg); white-space: nowrap;
    }
    .intro-text {
      position: absolute; left: 50%; top: 50%;
      translate: -50% -50%;
      display: flex; flex-direction: column; align-items: center;
      will-change: translate;
    }
    .intro-text > * { opacity: 0; transform: translateY(12px); transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1); }
    .intro-text > .tagline { transition-delay: 0.14s; }
    #intro.is-text .intro-text > * { opacity: 1; transform: translateY(0); }
    #intro.is-moving .intro-text {
      transition: translate 0.85s cubic-bezier(0.65, 0, 0.35, 1);
      translate: calc(-50% + var(--text-dx, 0px)) calc(-50% + var(--text-dy, 0px));
    }
    .intro-skip {
      position: absolute; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); z-index: 4;
      border: 0; background: transparent; padding: 8px 10px;
      font-family: var(--font-ui); font-size: 12px; color: var(--muted); cursor: pointer;
    }
    @media (prefers-reduced-motion: reduce) { #intro { display: none; } }

    /* 떠 있는 바로 가기 버튼 */
    .fab {
      position: fixed;
      right: max(20px, calc((100vw - 430px) / 2 + 20px));
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 10;
      display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
      font-family: var(--font-ui);
    }
    .fab__menu {
      width: 176px;
      display: flex; flex-direction: column;
      background: var(--paper);
      border-radius: 14px;
      box-shadow: 0 16px 32px -12px rgba(70, 48, 24, 0.45);
      overflow: hidden;
    }
    .fab__menu a {
      display: flex; align-items: center; justify-content: space-between;
      height: 48px; padding: 0 18px;
      font-size: 15px; font-weight: 500;
      color: var(--ink); text-decoration: none;
    }
    .fab__menu a + a { border-top: 1px solid var(--rule); }
    .fab__menu a::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--oak); }
    .fab__menu a:focus-visible { outline: 2px solid var(--oak); outline-offset: -4px; }
    .fab__button {
      width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0;
      background: var(--oak); color: var(--paper);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 20px -8px rgba(70, 48, 24, 0.55);
      cursor: pointer;
    }
    .fab__button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }


    /* 글꼴 확인 패널. 시안 확인용이며 확정 후 지웁니다 */
    .fontbar {
      position: fixed; top: 8px; right: 8px; z-index: 20;
      display: flex; flex-direction: column; gap: 6px;
      padding: 8px 10px; background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--rule); border-radius: 8px;
      font: 12px/1.4 -apple-system, 'Apple SD Gothic Neo', sans-serif; color: var(--ink);
    }
    .fontbar label { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .fontbar select { font-size: 12px; max-width: 190px; }
    .fontbar__row { display: flex; gap: 6px; justify-content: flex-end; }
    .fontbar button { font-size: 11px; }
  </style>
</head>
<body>
  <div class="page">

    <section id="cover" class="block block--fixed">
      <div class="cover-head" id="coverHead">
        <div class="eyebrow">Wedding Invitation</div>
        <p class="tagline">우리의 삶을 함께 써 주신 당신께</p>
      </div>
      <div class="popup">
        <img class="popup__hall" src="../design/canvas/hall.jpg" alt="더채플앳청담 커티지홀">
        <div class="popup__shadow"></div>
        <img class="popup__couple" src="../design/canvas/couple.png" alt="이산하와 송시야">
        <div class="popup__fade"></div>
      </div>
      <div class="names">
        <div class="names__name">이산하</div>
        <div class="names__and">그리고</div>
        <div class="names__name">송시야</div>
      </div>
    </section>

    <section id="info" class="block block--fixed">
      <div class="letter-card">
        <img class="letter-card__art" src="../design/canvas/opened-paper.png" alt="">
        <div class="letter-card__text">
          <div>2026년 10월 9일 금요일</div>
          <div>오후 6시 30분</div>
          <div class="letter-card__rule"></div>
          <div class="letter-card__venue">더채플앳청담</div>
          <div>3층 커티지홀</div>
        </div>
      </div>
    </section>

    <!-- 3쪽(인사)부터 여기 아래에 이어 붙입니다 -->

  </div>

  <div id="intro" aria-hidden="true">
    <div class="inside">
      <div class="intro-text" id="introText">
        <div class="eyebrow">Wedding Invitation</div>
        <p class="tagline">우리의 삶을 함께 써 주신 당신께</p>
      </div>
    </div>
    <div class="gate">
      <div class="gate__panel gate__left"><div class="gate__band"></div></div>
      <div class="gate__panel gate__right"><div class="gate__band"></div><div class="gate__note">Thanks to everyone.</div></div>
      <svg class="bow" viewBox="0 0 320 220" aria-hidden="true">
        <defs>
          <linearGradient id="satin" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#FDFAF4"></stop>
            <stop offset="0.45" stop-color="#EFE7D7"></stop>
            <stop offset="0.7" stop-color="#F9F4EA"></stop>
            <stop offset="1" stop-color="#E4DAC6"></stop>
          </linearGradient>
          <linearGradient id="satin-dark" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#E9E0CE"></stop>
            <stop offset="1" stop-color="#D4C8B0"></stop>
          </linearGradient>
        </defs>
        <path class="bow__tail--l" d="M152 84 C 132 118, 100 158, 74 198 L 108 206 L 100 190 C 120 158, 142 128, 160 96 Z" fill="url(#satin)" stroke="#D9CEB8" stroke-width="0.8"></path>
        <path class="bow__tail--r" d="M168 84 C 188 118, 220 158, 246 198 L 212 206 L 220 190 C 200 158, 178 128, 160 96 Z" fill="url(#satin)" stroke="#D9CEB8" stroke-width="0.8"></path>
        <path class="bow__loop--l" d="M160 70 C 128 22, 42 22, 44 70 C 46 114, 126 104, 160 70 Z" fill="url(#satin)" stroke="#D9CEB8" stroke-width="0.8"></path>
        <path class="bow__loop--l" d="M158 70 C 132 40, 70 40, 72 70 C 74 98, 132 92, 158 70 Z" fill="url(#satin-dark)" opacity="0.55"></path>
        <path class="bow__loop--r" d="M160 70 C 192 22, 278 22, 276 70 C 274 114, 194 104, 160 70 Z" fill="url(#satin)" stroke="#D9CEB8" stroke-width="0.8"></path>
        <path class="bow__loop--r" d="M162 70 C 188 40, 250 40, 248 70 C 246 98, 188 92, 162 70 Z" fill="url(#satin-dark)" opacity="0.55"></path>
        <rect class="bow__knot" x="146" y="56" width="28" height="28" rx="9" fill="url(#satin)" stroke="#D9CEB8" stroke-width="0.8"></rect>
      </svg>
    </div>
    <button type="button" class="intro-skip" id="introSkip">건너뛰기</button>
  </div>

  <nav class="fab" id="fab" data-open="false" aria-label="바로 가기">
    <div class="fab__menu" id="fabMenu" hidden>
      <a href="#directions">오시는 길</a>
      <a href="#contact">연락처</a>
      <a href="#gift">마음 전하는 곳</a>
    </div>
    <button type="button" class="fab__button" id="fabButton" aria-expanded="false" aria-controls="fabMenu" aria-label="바로 가기 메뉴">
      <svg class="icon-open" width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M4 6.5h14M4 11h14M4 15.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <svg class="icon-close" width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true" style="display: none;"><path d="M6 6l10 10M16 6L6 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
    </button>
  </nav>

  <div class="fontbar" id="fontbar">
    <label>이름·문장 <select id="fontName">
      <option value="'Gowun Batang', serif">고운바탕 (Gowun Batang)</option>
      <option value="'Nanum Myeongjo', serif">나눔명조 (Nanum Myeongjo)</option>
      <option value="'Noto Serif KR', serif">노토 세리프 KR</option>
      <option value="'Hahmlet', serif">함렛 (Hahmlet)</option>
      <option value="'Song Myung', serif">송명 (Song Myung)</option>
      <option value="'Diphylleia', serif">디필레이아 (Diphylleia)</option>
      <option value="'Grandiflora One', serif">그랑디플로라 (Grandiflora One)</option>
      <option value="'Nanum Pen Script', cursive" selected>나눔손글씨 펜 (Nanum Pen Script)</option>
      <option value="'Nanum Brush Script', cursive">나눔손글씨 붓 (Nanum Brush Script)</option>
      <option value="'Gaegu', cursive">개구 (Gaegu)</option>
      <option value="'Hi Melody', cursive">하이멜로디 (Hi Melody)</option>
      <option value="'Gamja Flower', cursive">감자꽃 (Gamja Flower)</option>
      <option value="'Noto Sans KR', sans-serif">노토 산스 KR</option>
    </select></label>
    <label>본문 <select id="fontBody">
      <option value="'Noto Sans KR', sans-serif" selected>노토 산스 KR (Noto Sans KR)</option>
      <option value="'Gowun Batang', serif">고운바탕 (Gowun Batang)</option>
      <option value="'Nanum Myeongjo', serif">나눔명조 (Nanum Myeongjo)</option>
      <option value="'Noto Serif KR', serif">노토 세리프 KR</option>
      <option value="'Hahmlet', serif">함렛 (Hahmlet)</option>
      <option value="'Diphylleia', serif">디필레이아 (Diphylleia)</option>
      <option value="'Pretendard', sans-serif">프리텐다드 (Pretendard)</option>
      <option value="'Gowun Dodum', sans-serif">고운돋움 (Gowun Dodum)</option>
    </select></label>
    <label>안내 <select id="fontUi">
      <option value="'Noto Sans KR', sans-serif" selected>노토 산스 KR (Noto Sans KR)</option>
      <option value="'Gowun Dodum', sans-serif">고운돋움 (Gowun Dodum)</option>
      <option value="'Pretendard', sans-serif">프리텐다드 (Pretendard)</option>
      <option value="'Nanum Gothic', sans-serif">나눔고딕 (Nanum Gothic)</option>
      <option value="'IBM Plex Sans KR', sans-serif">IBM Plex Sans KR</option>
    </select></label>
    <div class="fontbar__row">
      <button type="button" id="introReplay">진입 장면 다시</button>
      <button type="button" id="fontbarHide">패널 닫기</button>
    </div>
  </div>
  <script>
    (function () {
      var root = document.documentElement;
      var bind = function (id, cssVar) {
        var el = document.getElementById(id);
        el.addEventListener('change', function () { root.style.setProperty(cssVar, el.value + ", 'Apple SD Gothic Neo'"); });
      };
      bind('fontName', '--font-name');
      bind('fontBody', '--font-body');
      bind('fontUi', '--font-ui');
      document.getElementById('fontbarHide').addEventListener('click', function () { document.getElementById('fontbar').hidden = true; });

      var fab = document.getElementById('fab');
      var button = document.getElementById('fabButton');
      var menu = document.getElementById('fabMenu');
      var iconOpen = button.querySelector('.icon-open');
      var iconClose = button.querySelector('.icon-close');
      var setOpen = function (open) {
        fab.dataset.open = open ? 'true' : 'false';
        button.setAttribute('aria-expanded', open ? 'true' : 'false');
        button.setAttribute('aria-label', open ? '메뉴 닫기' : '바로 가기 메뉴');
        iconOpen.style.display = open ? 'none' : '';
        iconClose.style.display = open ? '' : 'none';
        menu.hidden = !open;
      };
      button.addEventListener('click', function () { setOpen(menu.hidden); });
      menu.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });
      document.addEventListener('click', function (e) { if (!fab.contains(e.target)) setOpen(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });

      /* 진입 장면. 순서: 리본 풀림 → 표지 좌우 열림 → 표제 떠오름 → 표제가 커버 자리로 → 걷힘 */
      var intro = document.getElementById('intro');
      var introText = document.getElementById('introText');
      var coverHead = document.getElementById('coverHead');
      var timers = [];
      var finished = false;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var finish = function () {
        if (finished) return;
        finished = true;
        timers.forEach(clearTimeout);
        root.classList.remove('is-intro');
        intro.classList.add('is-done');
        timers.push(setTimeout(function () { intro.hidden = true; }, 400));
      };
      var play = function () {
        finished = false;
        timers.forEach(clearTimeout); timers = [];
        window.scrollTo(0, 0);
        intro.hidden = false;
        intro.className = '';
        introText.style.removeProperty('--text-dx');
        introText.style.removeProperty('--text-dy');
        root.classList.add('is-intro');
        void intro.offsetWidth;
        timers.push(setTimeout(function () { intro.classList.add('is-untie'); }, 700));
        timers.push(setTimeout(function () { intro.classList.add('is-opening'); }, 1800));
        timers.push(setTimeout(function () { intro.classList.add('is-text'); }, 2500));
        timers.push(setTimeout(function () {
          var from = introText.getBoundingClientRect();
          var to = coverHead.getBoundingClientRect();
          introText.style.setProperty('--text-dx', (to.left + to.width / 2 - (from.left + from.width / 2)).toFixed(1) + 'px');
          introText.style.setProperty('--text-dy', (to.top + to.height / 2 - (from.top + from.height / 2)).toFixed(1) + 'px');
          intro.classList.add('is-moving');
        }, 3600));
        timers.push(setTimeout(finish, 4500));
      };
      intro.addEventListener('click', function (e) { if (e.target.closest('.intro-skip')) finish(); });
      document.getElementById('introReplay').addEventListener('click', function () { setOpen(false); play(); });
      if (reduced) { intro.hidden = true; } else { play(); }
    })();
  </script>
</body>
</html>
