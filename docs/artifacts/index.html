<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>이산하 · 송시야 청첩장</title>
  <!-- 글꼴 후보. 시안 확인용으로 여럿을 싣습니다. 확정되면 쓰는 것만 남깁니다 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;600&family=Hahmlet:wght@400;600&family=Song+Myung&family=Diphylleia&family=Grandiflora+One&family=Nanum+Pen+Script&family=Nanum+Brush+Script&family=Gaegu:wght@400;700&family=Hi+Melody&family=Gamja+Flower&family=Gowun+Dodum&family=Nanum+Gothic:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&family=Cormorant+Garamond:wght@500;600&family=Dancing+Script:wght@500&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { box-sizing: border-box; }
    :root {
      --paper-bg: #F3ECDF;
      --paper: #FBF7EF;
      --ink: #2F2A25;
      --ink-soft: #4A423B;
      --muted: #7A6F63;
      --oak: #B98E5E;
      --rule: #EDE4D3;
      --envelope: #E4D6BE;
      --envelope-front: #EEE2CC;
      --envelope-flap: #DFCFB4;
      --font-name: 'Gowun Batang', 'Apple SD Gothic Neo', serif;
      --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      --font-ui: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      --font-latin: 'Cormorant Garamond', Georgia, serif;
      --font-script: 'Dancing Script', 'Snell Roundhand', cursive;
    }
    html { color-scheme: light only; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0;
      background: #E9E1D2;
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      position: relative;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: var(--paper-bg);
      box-shadow: 0 0 40px -20px rgba(70, 48, 24, 0.5);
    }
    .block { position: relative; }
    .block--fixed { min-height: 100dvh; }

    /* 1. 커버. 종이 무대 위의 두 사람. 홀 사진은 그대로(불투명도 1), 두 사람은 통로 위에 서며, 이름이 주인공입니다 */
    #cover {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(56px + env(safe-area-inset-top)) 24px calc(56px + env(safe-area-inset-bottom));
      overflow: hidden;
    }
    .cover-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
    .cover-bg__hall {
      width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block;
      filter: saturate(0.7);
      animation: cover-zoom 16s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }
    /* 상단 1/4 흐림. 두 겹의 배경 흐림을 마스크로 겹쳐 위로 갈수록 더 흐려집니다 */
    .cover-bg__blur { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; }
    .cover-bg__blur--soft { height: 26%; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); mask-image: linear-gradient(to bottom, #000 0%, #000 35%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 35%, transparent 100%); }
    .cover-bg__blur--strong { height: 16%; backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); mask-image: linear-gradient(to bottom, #000 0%, #000 30%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 30%, transparent 100%); }
    .cover-bg__shadow {
      position: absolute; left: calc(50% + 10px); bottom: 21.4%;
      width: 40%; height: 18px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(70, 48, 24, 0.38), rgba(70, 48, 24, 0) 68%);
    }
    .cover-bg__couple {
      position: absolute; left: calc(50% + 10px); bottom: 22%;
      height: 27%; width: auto; transform: translateX(-50%);
      filter: drop-shadow(0 2px 2px rgba(70, 48, 24, 0.28)) drop-shadow(0 18px 18px rgba(70, 48, 24, 0.18));
    }
    /* 진입 장면이 끝나면 홀 사진이 천천히 물러나고 표제·이름이 떠오릅니다. 장면 동안은 첫 프레임에서 멈춰 있습니다 */
    .cover-head, .names { animation: cover-fade 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) both; }
    .names { animation-delay: 0.12s; }
    html.is-intro .cover-bg__hall, html.is-intro .cover-head, html.is-intro .names { animation-play-state: paused; }
    @keyframes cover-zoom { from { transform: scale(1.07); } to { transform: scale(1); } }
    @keyframes cover-fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) { .cover-bg__hall, .cover-head, .names { animation: none; } }
    .cover-head { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
    .eyebrow {
      font-family: var(--font-latin);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.36em;
      text-indent: 0.36em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.4;
      white-space: nowrap;
    }
    .tagline { margin: 10px 0 0; font-family: var(--font-name); font-size: 24px; line-height: 1.5; color: var(--ink-soft); white-space: nowrap; }
    .names { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .names__name { font-family: var(--font-name); font-size: 30px; font-weight: 700; letter-spacing: 0.14em; text-indent: 0.14em; line-height: 1.35; color: var(--ink); }
    .names__and { font-family: var(--font-ui); font-size: 12px; letter-spacing: 0.1em; color: var(--muted); line-height: 1.4; }

    /* 2. 핵심 정보. 열린 봉투 일러스트 위 편지지에 날짜·시간·장소 */
    #info { display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .letter-card {
      position: relative;
      width: min(340px, 86vw, calc((100dvh - 80px) * 817 / 1438));
      aspect-ratio: 817 / 1438;
    }
    .letter-card__art { display: block; width: 100%; height: 100%; }
    .letter-card__text {
      position: absolute; left: 22%; right: 22%; top: 13%; height: 46%;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      text-align: center; font-size: 16px; line-height: 1.7; color: var(--ink-soft);
    }
    .letter-card__venue { font-size: 17px; font-weight: 500; color: var(--ink); }
    .letter-card__rule { width: 28px; height: 1px; background: var(--oak); margin: 12px 0; }

    /* 진입 장면. 닫힌 팝업북이 떠오르고, 표지가 젖혀지면 홀 배경과 두 사람이 종이처럼 일어서며, 시점이 내려와 그 장면이 그대로 커버가 됩니다.
       무대는 커버와 같은 크기(--W × --H)이고 바닥선은 커버에서 두 사람의 발 위치(아래 22%)입니다. 장면 끝에서 홀 조각·두 사람이 커버의 같은 자리에 겹칩니다 */
    html.is-intro { overflow: hidden; }
    #intro {
      position: fixed; inset: 0; z-index: 30;
      --W: min(430px, 100vw); --H: 100dvh;
      --leaf-w: calc(var(--W) * 0.65); --leaf-h: calc(var(--W) * 0.94);
      --hall-h: calc(var(--H) * 0.78);
      --couple-h: calc(var(--H) * 0.27); --couple-w: calc(var(--H) * 0.27 * 0.6025);
      --couple-z: calc(var(--leaf-h) * 0.35);
      background: #E9E1D2;
      transition: opacity 0.35s ease, background-color 0.4s ease;
    }
    /* 시점이 거의 내려온 뒤(1.0초 뒤)에야 바탕을 걷어 아래 커버가 비칩니다. 일찍 걷으면 움직이는 두 사람 뒤로 커버의 두 사람이 겹쳐 보입니다 */
    #intro.is-diving { background-color: transparent; transition: opacity 0.35s ease, background-color 0.3s ease 1s; }
    #intro.is-done { opacity: 0; pointer-events: none; }
    #intro.is-reset, #intro.is-reset * { transition: none !important; }
    .stage {
      position: absolute; left: 50%; top: 0; width: var(--W); height: var(--H);
      opacity: 0;
      transform: translate(-50%, -44%) scale(0.78);
      transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.22, 0.61, 0.36, 1);
    }
    #intro.is-shown .stage { opacity: 1; transform: translate(-50%, -44%) scale(0.8); }
    #intro.is-open .stage { transform: translate(-50%, -20%) scale(0.75); transition: opacity 0.5s ease, transform 1.6s cubic-bezier(0.65, 0, 0.35, 1); }
    #intro.is-diving .stage { transform: translate(-50%, 0) scale(1); transition: opacity 0.5s ease, transform 1.2s cubic-bezier(0.65, 0, 0.35, 1); }
    .book { position: absolute; inset: 0; perspective: 1600px; perspective-origin: 50% 50%; transition: perspective-origin 1.2s cubic-bezier(0.65, 0, 0.35, 1); }
    #intro.is-diving .book { perspective-origin: 50% 78%; }
    /* 세계. 바닥선을 축으로 기울여 위에서 내려다봅니다. 마지막에 0도가 되어 정면이 됩니다 */
    .world { position: absolute; inset: 0; transform-style: preserve-3d; transform-origin: 50% 78%; transform: rotateX(-55deg); transition: transform 1.6s cubic-bezier(0.65, 0, 0.35, 1); }
    #intro.is-open .world { transform: rotateX(-34deg); }
    #intro.is-diving .world { transform: rotateX(0deg); transition-duration: 1.2s; }
    /* 바닥. 펼친 면이 놓이는 평면. 원점은 바닥선 가운데, 안쪽 y는 보는 쪽으로 향합니다. 닫혀 있을 때는 책이 가운데 오도록 반 쪽 옮깁니다 */
    .floor { position: absolute; left: 50%; top: 78%; width: 0; height: 0; transform-style: preserve-3d; transform: translateX(calc(var(--leaf-w) / -2)) rotateX(90deg); transition: transform 1.3s cubic-bezier(0.65, 0, 0.35, 1); }
    #intro.is-open .floor { transform: translateX(0) rotateX(90deg); }
    /* 책장. 오른쪽 면은 고정, 표지는 책등(가운데)을 축으로 왼쪽으로 젖혀집니다 */
    .leaf { position: absolute; top: 0; width: var(--leaf-w); height: var(--leaf-h); border-radius: 2px; transition: opacity 0.5s ease 0.5s; }
    .leaf--right { left: 0; box-shadow: 0 0 0 0.5px rgba(70, 48, 24, 0.12), 0 8px 18px -8px rgba(70, 48, 24, 0.45); overflow: hidden; }
    .leaf__art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    .leaf__shade { position: absolute; inset: 0; pointer-events: none; }
    .leaf--right .leaf__shade { background: linear-gradient(to right, rgba(70, 48, 24, 0.12), transparent 12%); }
    .leaf__inner .leaf__shade { background: linear-gradient(to left, rgba(70, 48, 24, 0.12), transparent 12%); }
    .leaf--cover { left: calc(-1 * var(--leaf-w)); transform-origin: 100% 50%; transform-style: preserve-3d; transform: translateZ(3px) rotateY(180deg); transition: transform 1.3s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.5s ease 0.5s; }
    #intro.is-open .leaf--cover { transform: translateZ(0.5px) rotateY(0deg); }
    .leaf__face { position: absolute; inset: 0; border-radius: 2px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .leaf__inner { box-shadow: 0 0 0 0.5px rgba(70, 48, 24, 0.12); overflow: hidden; }
    /* 표지 바깥면. 천 질감·이중 괘선·책등 그늘은 public/intro/book-cover.png(원본 docs/artifacts/assets/book-cover.svg)에 있고 제목만 HTML로 얹습니다. 괘선 가운데(가로 53.6%)에 글자를 맞춥니다 */
    .leaf__outer {
      transform: rotateY(180deg);
      box-shadow: 0 0 0 0.5px rgba(70, 48, 24, 0.18), 0 10px 22px -10px rgba(70, 48, 24, 0.5);
      overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
      padding: 16px 12px 16px calc(12px + var(--leaf-w) * 0.0714);
    }
    .leaf__outer > .eyebrow, .leaf__outer > .leaf__rule, .leaf__outer > .leaf__tagline { position: relative; }
    .leaf__rule { width: 24px; height: 1px; background: var(--oak); margin: 10px auto; }
    .leaf__tagline { margin: 0; font-family: var(--font-name); font-size: 15px; line-height: 1.6; color: var(--ink-soft); }
    .leaf__note { position: absolute; right: 16px; bottom: 14px; font-family: var(--font-script); font-size: 14px; font-weight: 500; line-height: 1.2; color: #7E5A33; transform: rotate(-4deg); white-space: nowrap; }
    /* 바닥 그림자. 홀 조각이 드리우는 띠와 두 사람 발밑 타원. 일어설 때 나타나고 시점이 내려오면 사라집니다 */
    .floor__wall { position: absolute; left: calc(var(--W) / -2); top: 0; width: var(--W); height: 44px; transform: translateZ(1px); background: linear-gradient(to bottom, rgba(70, 48, 24, 0.30), rgba(70, 48, 24, 0)); opacity: 0; transition: opacity 0.7s ease; }
    .floor__feet { position: absolute; left: calc(10px - var(--W) * 0.2); top: calc(var(--couple-z) - 9px); width: calc(var(--W) * 0.4); height: 18px; transform: translateZ(1px); border-radius: 50%; background: radial-gradient(ellipse at center, rgba(70, 48, 24, 0.38), rgba(70, 48, 24, 0) 68%); opacity: 0; transition: opacity 0.7s ease 0.3s; }
    #intro.is-rising .floor__wall, #intro.is-rising .floor__feet { opacity: 1; }
    #intro.is-diving .floor__wall, #intro.is-diving .floor__feet, #intro.is-diving .leaf { opacity: 0; transition: opacity 0.5s ease 0.5s; }
    /* 일어서는 조각. 경첩은 위쪽 변(바닥선 쪽). 접혀 있을 때는 뒷면(종이색)이 위를 보고, 90도로 서면 앞면(그림)이 보는 쪽을 향합니다 */
    .pop { position: absolute; left: 0; top: 0; transform-origin: 50% 0; transform-style: preserve-3d; visibility: hidden; transition: transform 1s cubic-bezier(0.34, 1.25, 0.64, 1), visibility 0s 0.62s; }
    #intro.is-open .pop { visibility: visible; }
    .pop__face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .pop__front { transform: rotateX(180deg); overflow: hidden; }
    .pop__back { background: var(--paper); box-shadow: 0 0 0 0.5px rgba(70, 48, 24, 0.14); overflow: hidden; }
    .pop--hall {
      width: var(--W); height: var(--hall-h);
      transform: translateX(-50%) translateZ(1.5px) rotateX(0deg);
      transition: transform 1s cubic-bezier(0.34, 1.25, 0.64, 1), visibility 0s 0.62s;
    }
    #intro.is-rising .pop--hall { transform: translateX(-50%) translateZ(1.5px) rotateX(90deg); }
    /* 장면 동안은 홀 조각의 위쪽 46%(선 채로 봤을 때 윗부분)를 잘라 책 깊이에 맞추고, 시점이 내려올 때 끝까지 폅니다. 자르기는 면에 겁니다(3D 컨테이너에 걸면 평면화됩니다) */
    .pop--hall .pop__front { clip-path: inset(46% 0 0 0); transition: clip-path 1.2s cubic-bezier(0.65, 0, 0.35, 1); }
    .pop--hall .pop__back { clip-path: inset(0 0 46% 0); transition: clip-path 1.2s cubic-bezier(0.65, 0, 0.35, 1); }
    #intro.is-diving .pop--hall .pop__face { clip-path: inset(0 0 0 0); }
    .pop--hall .pop__front img { position: absolute; left: 0; top: 0; width: var(--W); height: var(--H); object-fit: cover; object-position: 50% 50%; display: block; filter: saturate(0.7); transform: scale(1.07); }
    .pop--hall .cover-bg__blur--soft { height: calc(var(--H) * 0.26); }
    .pop--hall .cover-bg__blur--strong { height: calc(var(--H) * 0.16); }
    .pop--couple {
      left: 10px; top: var(--couple-z); width: var(--couple-w); height: var(--couple-h);
      transform: translate(-50%, 0) translateZ(2px) rotateX(0deg);
      transition: transform 0.85s cubic-bezier(0.34, 1.3, 0.64, 1) 0.2s, visibility 0s 0.62s;
    }
    #intro.is-rising .pop--couple { transform: translate(-50%, 0) translateZ(2px) rotateX(90deg); }
    /* 시점이 내려올 때 두 사람이 홀 조각 평면(z=0)으로 물러나 커버의 자리와 정확히 겹칩니다 */
    #intro.is-diving .pop--couple { transform: translate(-50%, calc(-1 * var(--couple-z))) translateZ(2px) rotateX(90deg); transition: transform 1.2s cubic-bezier(0.65, 0, 0.35, 1), visibility 0s 0.62s; }
    .pop--couple .pop__face { background: transparent; box-shadow: none; }
    .pop--couple img { display: block; width: 100%; height: 100%; }
    .pop--couple .pop__front img { filter: drop-shadow(0 2px 2px rgba(70, 48, 24, 0.28)) drop-shadow(0 18px 18px rgba(70, 48, 24, 0.18)); }
    .pop--couple .pop__back img { filter: brightness(0) invert(1) sepia(0.6) brightness(0.97); }
    .intro-skip {
      position: absolute; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
      border: 0; background: transparent; padding: 8px 10px;
      font-family: var(--font-ui); font-size: 12px; color: var(--muted); cursor: pointer;
    }
    @media (prefers-reduced-motion: reduce) { #intro { display: none; } }

    /* 떠 있는 바로 가기 버튼 */
    .fab {
      position: fixed;
      right: max(20px, calc((100vw - 430px) / 2 + 20px));
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 10;
      display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
      font-family: var(--font-ui);
    }
    .fab__menu {
      width: 176px;
      display: flex; flex-direction: column;
      background: var(--paper);
      border-radius: 14px;
      box-shadow: 0 16px 32px -12px rgba(70, 48, 24, 0.45);
      overflow: hidden;
    }
    .fab__menu a {
      display: flex; align-items: center; justify-content: space-between;
      height: 48px; padding: 0 18px;
      font-size: 15px; font-weight: 500;
      color: var(--ink); text-decoration: none;
    }
    .fab__menu a + a { border-top: 1px solid var(--rule); }
    .fab__menu a::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--oak); }
    .fab__menu a:focus-visible { outline: 2px solid var(--oak); outline-offset: -4px; }
    .fab__button {
      width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0;
      background: var(--oak); color: var(--paper);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 20px -8px rgba(70, 48, 24, 0.55);
      cursor: pointer;
    }
    .fab__button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }


    /* 글꼴 확인 패널. 시안 확인용이며 확정 후 지웁니다 */
    .fontbar {
      position: fixed; top: 8px; right: 8px; z-index: 20;
      display: flex; flex-direction: column; gap: 6px;
      padding: 8px 10px; background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--rule); border-radius: 8px;
      font: 12px/1.4 -apple-system, 'Apple SD Gothic Neo', sans-serif; color: var(--ink);
    }
    .fontbar label { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .fontbar select { font-size: 12px; max-width: 190px; }
    .fontbar__row { display: flex; gap: 6px; justify-content: flex-end; }
    .fontbar button { font-size: 11px; }
  </style>
</head>
<body>
  <div class="page">

    <section id="cover" class="block block--fixed">
      <div class="cover-bg">
        <img class="cover-bg__hall" src="../design/scene1/scene1--wedding-hall.PNG" alt="더채플앳청담 커티지홀">
        <div class="cover-bg__blur cover-bg__blur--soft"></div>
        <div class="cover-bg__blur cover-bg__blur--strong"></div>
        <div class="cover-bg__shadow"></div>
        <img class="cover-bg__couple" src="../design/canvas/couple.png" alt="이산하와 송시야">
      </div>
      <div class="cover-head">
        <div class="eyebrow">Wedding Invitation</div>
        <p class="tagline">우리의 삶을 함께 써 주신 당신께</p>

      <option value="'Hahmlet', serif">함렛 (Hahmlet)</option>
      <option value="'Diphylleia', serif">디필레이아 (Diphylleia)</option>
      <option value="'Pretendard', sans-serif">프리텐다드 (Pretendard)</option>

  <script>
    (function () {
      var root = document.documentElement;
      var bind = function (id, cssVar) {
        var el = document.getElementById(id);
        el.addEventListener('change', function () { root.style.setProperty(cssVar, el.value + ", 'Apple SD Gothic Neo'"); });
      };
      bind('fontName', '--font-name');
      bind('fontBody', '--font-body');
      bind('fontUi', '--font-ui');
      document.getElementById('fontbarHide').addEventListener('click', function () { document.getElementById('fontbar').hidden = true; });

      var fab = document.getElementById('fab');
      var button = document.getElementById('fabButton');
      var menu = document.getElementById('fabMenu');
      var iconOpen = button.querySelector('.icon-open');
      var iconClose = button.querySelector('.icon-close');
      var setOpen = function (open) {
        fab.dataset.open = open ? 'true' : 'false';
        button.setAttribute('aria-expanded', open ? 'true' : 'false');
        button.setAttribute('aria-label', open ? '메뉴 닫기' : '바로 가기 메뉴');
        iconOpen.style.display = open ? 'none' : '';
        iconClose.style.display = open ? '' : 'none';
        menu.hidden = !open;
      };
      button.addEventListener('click', function () { setOpen(menu.hidden); });
      menu.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });
      document.addEventListener('click', function (e) { if (!fab.contains(e.target)) setOpen(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });

      /* 진입 장면. 순서: 닫힌 책 등장 → 표지 젖힘(책이 가운데로) → 홀 조각·두 사람이 일어섬 → 시점이 내려오며 무대가 화면을 채움(조각이 커버 자리에 겹침) → 걷힘 */
      var intro = document.getElementById('intro');
      var coverAnimated = document.querySelectorAll('.cover-bg__hall, .cover-head, .names');
      var timers = [];
      var finished = false;
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var restart = function () {
        coverAnimated.forEach(function (el) { el.style.animation = 'none'; void el.offsetWidth; el.style.animation = ''; });
      };
      var finish = function () {
        if (finished) return;
        finished = true;
        timers.forEach(clearTimeout);
        root.classList.remove('is-intro');
        intro.classList.add('is-done');
        timers.push(setTimeout(function () { intro.hidden = true; }, 400));
      };
      var play = function () {
        finished = false;
        timers.forEach(clearTimeout); timers = [];
        window.scrollTo(0, 0);
        intro.hidden = false;
        intro.className = 'is-reset';
        root.classList.add('is-intro');
        restart();
        void intro.offsetWidth;
        intro.className = '';
        timers.push(setTimeout(function () { intro.classList.add('is-shown'); }, 60));
        timers.push(setTimeout(function () { intro.classList.add('is-open'); }, 600));
        timers.push(setTimeout(function () { intro.classList.add('is-rising'); }, 1450));
        timers.push(setTimeout(function () { intro.classList.add('is-diving'); }, 2750));
        timers.push(setTimeout(finish, 3950));
      };
      intro.addEventListener('click', function (e) { if (e.target.closest('.intro-skip')) finish(); });
      document.getElementById('introReplay').addEventListener('click', function () { setOpen(false); play(); });
      if (reduced) { intro.hidden = true; } else { play(); }
    })();
  </script>
