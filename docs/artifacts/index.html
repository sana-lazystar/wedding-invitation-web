<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>이산하 · 송시야 청첩장</title>
  <!-- 글꼴 후보. 시안 확인용으로 여럿을 싣습니다. 확정되면 쓰는 것만 남깁니다 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+KR:wght@400;600&family=Hahmlet:wght@400;600&family=Song+Myung&family=Diphylleia&family=Grandiflora+One&family=Nanum+Pen+Script&family=Nanum+Brush+Script&family=Gaegu:wght@400;700&family=Hi+Melody&family=Gamja+Flower&family=Gowun+Dodum&family=Nanum+Gothic:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500&family=Cormorant+Garamond:wght@500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <style>
    * { box-sizing: border-box; }
    :root {
      --paper-bg: #F3ECDF;
      --paper: #FBF7EF;
      --ink: #2F2A25;
      --ink-soft: #4A423B;
      --muted: #7A6F63;
      --oak: #B98E5E;
      --rule: #EDE4D3;
      --font-name: 'Gowun Batang', 'Apple SD Gothic Neo', serif;
      --font-body: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      --font-ui: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      --font-latin: 'Cormorant Garamond', Georgia, serif;
    }
    html { color-scheme: light only; scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0;
      background: #E9E1D2;
      color: var(--ink);
      font-family: var(--font-body);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      position: relative;
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      background: var(--paper-bg);
      box-shadow: 0 0 40px -20px rgba(70, 48, 24, 0.5);
    }
    .block { position: relative; }
    .block--fixed { min-height: 100dvh; }

    /* 1. 커버. 종이 무대 위의 두 사람. 홀 사진은 그대로(불투명도 1), 두 사람은 통로 위에 서며, 이름이 주인공입니다 */
    #cover {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: calc(56px + env(safe-area-inset-top)) 24px calc(56px + env(safe-area-inset-bottom));
      overflow: hidden;
    }
    .cover-bg { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
    .cover-bg__hall {
      width: 100%; height: 100%; object-fit: cover; object-position: 50% 50%; display: block;
      filter: saturate(0.7);
    }
    /* 상단 1/4 흐림. 두 겹의 배경 흐림을 마스크로 겹쳐 위로 갈수록 더 흐려집니다 */
    .cover-bg__blur { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; }
    .cover-bg__blur--soft { height: 26%; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); mask-image: linear-gradient(to bottom, #000 0%, #000 35%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 35%, transparent 100%); }
    .cover-bg__blur--strong { height: 16%; backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px); mask-image: linear-gradient(to bottom, #000 0%, #000 30%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 30%, transparent 100%); }
    .cover-bg__shadow {
      position: absolute; left: calc(50% + 10px); bottom: 21.4%;
      width: 40%; height: 18px; transform: translateX(-50%);
      border-radius: 50%;
      background: radial-gradient(ellipse at center, rgba(70, 48, 24, 0.38), rgba(70, 48, 24, 0) 68%);
    }
    .cover-bg__couple {
      position: absolute; left: calc(50% + 10px); bottom: 22%;
      height: 27%; width: auto; transform: translateX(-50%);
      filter: drop-shadow(0 2px 2px rgba(70, 48, 24, 0.28)) drop-shadow(0 18px 18px rgba(70, 48, 24, 0.18));
    }
    /* 커버 자체는 움직이지 않습니다(디자인 논의 T33). 진입 장면(로딩)은 T34에서 걷어냈고 처음부터 다시 만듭니다 */
    .cover-head { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
    .eyebrow {
      font-family: var(--font-latin);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.36em;
      text-indent: 0.36em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.4;
      white-space: nowrap;
    }
    .tagline { margin: 10px 0 0; font-family: var(--font-name); font-size: 24px; line-height: 1.5; color: var(--ink-soft); white-space: nowrap; }
    .names { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .names__name { font-family: var(--font-name); font-size: 30px; font-weight: 700; letter-spacing: 0.14em; text-indent: 0.14em; line-height: 1.35; color: var(--ink); }
    .names__and { font-family: var(--font-ui); font-size: 12px; letter-spacing: 0.1em; color: var(--muted); line-height: 1.4; }

    /* 2. 핵심 정보. 열린 봉투 일러스트 위 편지지에 날짜·시간·장소 */
    #info { display: flex; align-items: center; justify-content: center; padding: 40px 24px; }
    .letter-card {
      position: relative;
      width: min(340px, 86vw, calc((100dvh - 80px) * 817 / 1438));
      aspect-ratio: 817 / 1438;
    }
    .letter-card__art { display: block; width: 100%; height: 100%; }
    .letter-card__text {
      position: absolute; left: 22%; right: 22%; top: 13%; height: 46%;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      text-align: center; font-size: 16px; line-height: 1.7; color: var(--ink-soft);
    }
    .letter-card__venue { font-size: 17px; font-weight: 500; color: var(--ink); }
    .letter-card__rule { width: 28px; height: 1px; background: var(--oak); margin: 12px 0; }

    /* 떠 있는 바로 가기 버튼 */
    .fab {
      position: fixed;
      right: max(20px, calc((100vw - 430px) / 2 + 20px));
      bottom: calc(20px + env(safe-area-inset-bottom));
      z-index: 10;
      display: flex; flex-direction: column; align-items: flex-end; gap: 12px;
      font-family: var(--font-ui);
    }
    .fab__menu {
      width: 176px;
      display: flex; flex-direction: column;
      background: var(--paper);
      border-radius: 14px;
      box-shadow: 0 16px 32px -12px rgba(70, 48, 24, 0.45);
      overflow: hidden;
    }
    .fab__menu a {
      display: flex; align-items: center; justify-content: space-between;
      height: 48px; padding: 0 18px;
      font-size: 15px; font-weight: 500;
      color: var(--ink); text-decoration: none;
    }
    .fab__menu[hidden] { display: none; }   /* 조립본에는 Tailwind 초기화가 없어 hidden 속성을 display: flex가 이깁니다 */
    .fab__menu a + a { border-top: 1px solid var(--rule); }
    .fab__menu a::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--oak); }
    .fab__menu a:focus-visible { outline: 2px solid var(--oak); outline-offset: -4px; }
    .fab__button {
      width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0;
      background: var(--oak); color: var(--paper);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 10px 20px -8px rgba(70, 48, 24, 0.55);
      cursor: pointer;
    }
    .fab__button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }


    /* 0. 진입 장면(로딩). 편지봉투가 화면 높이만큼 확대돼 있다가(좌우가 잘림) 물러나는 것과 동시에 뚜껑이 열리고, 뚜껑이 반쯤 열렸을 때 커버(Scene1)가 카드로 올라오며 봉투는 조금 내려가고, 봉투가 화면 아래로 쭉 빠져나가면 카드가 화면 가운데를 기준으로 커져 화면을 채웁니다(디자인 논의 T36~T41). 3.9초.
       층 구조가 핵심입니다. 바탕(.intro, z 25) < 카드 = 커버 자체(z 30) < 봉투 몸(.intro-layer--env, z 35) < 뚜껑(.intro-layer--flap, z 36 → 옆면을 지나는 0.92초에 28로 내려가 카드 뒤). 봉투 안에 든 카드 부분은 봉투가 자연히 가리므로 클립이 필요 없고, 봉투가 아래로 빠져나가면 그 뒤의 카드가 그대로 드러납니다.
       카드가 봉투 밑변 아래로 삐져나오는 부분만 clip-path로 가립니다. 그 선은 봉투 밑변을 따라갑니다. 카드가 올라오고 봉투가 내려가는 구간, 봉투가 화면 밖으로 빠져나가는 구간 각각에서 봉투 이동과 같은 시간표·곡선을 쓰므로 둘 다 선형으로 일치합니다.
       치수는 봉투 좌표(600×400)입니다. 배율 --z0(높이 = 화면) · --z1(전체가 보임, 폭 80%), 봉투 하강 --drop1(조금) · --drop2(화면 밖), 카드 값 --card-*(폭은 봉투의 92%)는 스크립트가 화면 크기에서 계산해 넣습니다. 봉투 몸과 뚜껑 층은 같은 확대·하강·흐려짐 애니메이션을 씁니다.
       마지막 프레임은 커버 정지 화면과 같습니다(변환 · 클립 · 필터 없음). 봉투 상자는 화면보다 넓을 수 있어 absolute + 음수 margin으로 가운데를 맞춥니다 */
    .is-intro { overflow: hidden; }
    .intro { position: fixed; inset: 0; z-index: 25; overflow: hidden; background: #E9E1D2; touch-action: none; }
    .intro-layer { position: fixed; inset: 0; overflow: hidden; pointer-events: none; visibility: hidden; }
    .is-intro-shown .intro-layer { visibility: visible; }
    .intro-layer--env { z-index: 35; }
    .intro-layer--flap { z-index: 36; }
    .intro__zoom { position: absolute; left: 50%; top: 50%; width: 600px; height: 400px; margin: -200px 0 0 -300px; transform: scale(var(--z0, 2.1)); }
    .intro__env { position: relative; width: 600px; height: 400px; perspective: 1400px; }
    .intro__back { position: absolute; left: 0; top: 0; width: 600px; height: 400px; filter: drop-shadow(0 18px 24px rgba(70, 48, 24, 0.28)) drop-shadow(0 2px 3px rgba(70, 48, 24, 0.25)); }
    .intro__flap { position: absolute; left: 0; top: 0; width: 600px; height: 236px; transform-origin: 50% 0; filter: drop-shadow(1.2px 2.6px 1.3px rgba(74, 54, 32, 0.34)) drop-shadow(0 0 3.2px rgba(74, 54, 32, 0.3)); }
    .intro__flap-out, .intro__flap-in { position: absolute; left: 0; top: 0; width: 600px; height: 236px; }
    .intro__flap-in { opacity: 0; }
    /* 봉인은 뚜껑의 자식이라 함께 젖혀집니다. 앞면은 바깥면 위에, 뒷면(어두운 밀랍)은 안쪽면 아래에 같은 자리로 두고 옆면에서 바꿉니다. 봉인이 뚜껑 끝보다 커서 젖혀진 뒤에는 뚜껑 끝 둘레로 뒷면이 보입니다 */
    .intro__seal, .intro__seal-back { position: absolute; left: 230px; top: 135px; width: 140px; height: 140px; }
    .intro__seal-back { opacity: 0; }
    .intro__skip {
      position: absolute; right: max(24px, calc((100vw - 430px) / 2 + 24px), env(safe-area-inset-right)); bottom: calc(26px + env(safe-area-inset-bottom));
      padding: 8px 6px; border: 0; background: none; cursor: pointer; opacity: 0;
      font-family: var(--font-name); font-size: 15px; line-height: 1; letter-spacing: 0.1em; text-indent: 0.1em; color: var(--ink-soft);
      text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; text-decoration-color: rgba(122, 111, 99, 0.55);
    }
    .is-intro #cover { z-index: 30; transform-origin: 50% 0; visibility: hidden; }
    .is-intro-shown #cover { visibility: visible; border-radius: 14px; filter: drop-shadow(0 14px 18px rgba(70, 48, 24, 0.35)); }
    /* 시간표. 0~0.4 확대된 채 · 0.4~1.2 물러남 · 0.4~2.2 뚜껑(옆면 1.2) · 1.0~2.0 카드 올라오고 봉투 조금 내려감 · 2.1~2.8 봉투가 화면 아래로 빠져나감 · 2.85~3.85 카드 확대 */
    .is-intro-shown .intro__zoom { animation: intro-zoom 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.4s both; }
    .is-intro-shown .intro__flap { animation: intro-flap 1.8s cubic-bezier(0.55, 0, 0.3, 1) 0.4s both; }
    /* 면 교체 시각 = 뚜껑이 90°를 지나는 순간. 곡선 cubic-bezier(0.55, 0, 0.3, 1)은 진행 50%가 시간 44.4%에 오므로 0.4 + 1.8 × 0.444 = 1.2초. 뚜껑 층도 이때 카드 뒤로 */
    .is-intro-shown .intro__flap-out, .is-intro-shown .intro__seal { animation: intro-hide 1ms linear 1.2s both; }
    .is-intro-shown .intro__flap-in, .is-intro-shown .intro__seal-back { animation: intro-show 1ms linear 1.2s both; }
    .is-intro-shown .intro-layer--flap { animation: intro-flap-layer 1ms linear 1.2s both; }
    /* 봉투 이동과 카드 클립은 구간마다 같은 시작·길이·곡선을 씁니다(밑변 추적). 뒤의 애니메이션은 forwards만 두어 앞 구간의 값을 덮지 않습니다 */
    .is-intro-shown .intro__env { animation: intro-drop 1s cubic-bezier(0.45, 0.05, 0.25, 1) 1s both, intro-drop-out 0.7s cubic-bezier(0.5, 0, 0.85, 0.45) 2.1s forwards; }
    .is-intro-shown #cover { animation: intro-card-rise 1s cubic-bezier(0.45, 0.05, 0.25, 1) 1s both, intro-card-clip-out 0.7s cubic-bezier(0.5, 0, 0.85, 0.45) 2.1s forwards, intro-card-grow 1s cubic-bezier(0.4, 0, 0.2, 1) 2.85s forwards; }
    .is-intro-shown .intro__skip { animation: intro-skip 3.2s linear 0s both; }
    @keyframes intro-zoom { from { transform: scale(var(--z0, 2.1)); } to { transform: scale(var(--z1, 0.57)); } }
    @keyframes intro-flap { from { transform: rotateX(0deg); } to { transform: rotateX(180deg); } }
    @keyframes intro-flap-layer { from { z-index: 36; } to { z-index: 28; } }
    @keyframes intro-hide { from { opacity: 1; } to { opacity: 0; } }
    @keyframes intro-show { from { opacity: 0; } to { opacity: 1; } }
    @keyframes intro-drop { from { transform: translateY(0); } to { transform: translateY(var(--drop1)); } }
    @keyframes intro-drop-out { from { transform: translateY(var(--drop1)); } to { transform: translateY(var(--drop2)); } }
    @keyframes intro-skip { 0% { opacity: 0; } 15% { opacity: 0; } 25% { opacity: 1; } 90% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes intro-card-rise {
      from { transform: translateY(var(--card-ty0)) scale(var(--card-s0)); clip-path: inset(0 -40px var(--card-b0) -40px); }
      to { transform: translateY(var(--card-ty1)) scale(var(--card-s0)); clip-path: inset(0 -40px var(--card-b1) -40px); }
    }
    @keyframes intro-card-clip-out { from { clip-path: inset(0 -40px var(--card-b1) -40px); } to { clip-path: inset(0 -40px var(--card-b2) -40px); } }
    @keyframes intro-card-grow {
      from { transform: translateY(var(--card-ty1)) scale(var(--card-s0)); border-radius: 14px; filter: drop-shadow(0 14px 18px rgba(70, 48, 24, 0.35)); }
      to { transform: translateY(0) scale(1); border-radius: 0; filter: drop-shadow(0 0 0 rgba(70, 48, 24, 0)); }
    }

    /* 글꼴 확인 패널. 시안 확인용이며 확정 후 지웁니다 */
    .fontbar {
      position: fixed; top: 8px; right: 8px; z-index: 20;
      display: flex; flex-direction: column; gap: 6px;
      padding: 8px 10px; background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--rule); border-radius: 8px;
      font: 12px/1.4 -apple-system, 'Apple SD Gothic Neo', sans-serif; color: var(--ink);
    }
    .fontbar label { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .fontbar select { font-size: 12px; max-width: 190px; }
    .fontbar__row { display: flex; gap: 6px; justify-content: flex-end; }
    .fontbar button { font-size: 11px; }
  </style>
</head>
<body>
  <!-- 진입 장면(로딩). 세 층입니다. 바탕(.intro) < 커버(카드) < 봉투 몸 < 뚜껑. 이미지는 public/intro/에 있습니다(원본 assets/*.svg). 스크립트가 배율을 넣고 그림이 준비되면 시작합니다. 어디를 탭해도 건너뜁니다 -->
  <div class="intro" id="intro" aria-hidden="true">
    <button type="button" class="intro__skip">넘어가기</button>
  </div>
  <div class="intro-layer intro-layer--env" id="introEnv" aria-hidden="true">
    <div class="intro__zoom">
      <div class="intro__env">
        <img class="intro__back" src="../../public/intro/envelope-back.png" alt="">
      </div>
    </div>
  </div>
  <div class="intro-layer intro-layer--flap" id="introFlap" aria-hidden="true">
    <div class="intro__zoom">
      <div class="intro__env">
        <div class="intro__flap">
          <img class="intro__seal-back" src="../../public/intro/wax-seal-back.png" alt="">
          <img class="intro__flap-in" src="../../public/intro/envelope-flap-inside.png" alt="">
          <img class="intro__flap-out" src="../../public/intro/envelope-flap.png" alt="">
          <img class="intro__seal" src="../../public/intro/wax-seal.png" alt="">
        </div>
      </div>
    </div>
  </div>

  <div class="page">

    <section id="cover" class="block block--fixed">
      <div class="cover-bg">
        <img class="cover-bg__hall" src="../design/scene1/scene1--wedding-hall.PNG" alt="더채플앳청담 커티지홀">
        <div class="cover-bg__blur cover-bg__blur--soft"></div>
        <div class="cover-bg__blur cover-bg__blur--strong"></div>
        <div class="cover-bg__shadow"></div>
        <img class="cover-bg__couple" src="../design/canvas/couple.png" alt="이산하와 송시야">
      </div>
      <div class="cover-head">
        <div class="eyebrow">Wedding Invitation</div>
        <p class="tagline">우리의 삶을 함께 써 주신 당신께</p>
      </div>
      <div class="names">
        <div class="names__name">이산하</div>
        <div class="names__and">그리고</div>
        <div class="names__name">송시야</div>
      </div>
    </section>

    <section id="info" class="block block--fixed">
      <div class="letter-card">
        <img class="letter-card__art" src="../design/canvas/opened-paper.png" alt="">
        <div class="letter-card__text">
          <div>2026년 10월 9일 금요일</div>
          <div>오후 6시 30분</div>
          <div class="letter-card__rule"></div>
          <div class="letter-card__venue">더채플앳청담</div>
          <div>3층 커티지홀</div>
        </div>
      </div>
    </section>

    <!-- 3쪽(인사)부터 여기 아래에 이어 붙입니다 -->

  </div>

  <nav class="fab" id="fab" data-open="false" aria-label="바로 가기">
    <div class="fab__menu" id="fabMenu" hidden>
      <a href="#directions">오시는 길</a>
      <a href="#contact">연락처</a>
      <a href="#gift">마음 전하는 곳</a>
    </div>
    <button type="button" class="fab__button" id="fabButton" aria-expanded="false" aria-controls="fabMenu" aria-label="바로 가기 메뉴">
      <svg class="icon-open" width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M4 6.5h14M4 11h14M4 15.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <svg class="icon-close" width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true" style="display: none;"><path d="M6 6l10 10M16 6L6 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
    </button>
  </nav>

  <div class="fontbar" id="fontbar">
    <label>이름·문장 <select id="fontName">
      <option value="'Gowun Batang', serif" selected>고운바탕 (Gowun Batang)</option>
      <option value="'Nanum Myeongjo', serif">나눔명조 (Nanum Myeongjo)</option>
      <option value="'Noto Serif KR', serif">노토 세리프 KR</option>
      <option value="'Hahmlet', serif">함렛 (Hahmlet)</option>
      <option value="'Song Myung', serif">송명 (Song Myung)</option>
      <option value="'Diphylleia', serif">디필레이아 (Diphylleia)</option>
      <option value="'Grandiflora One', serif">그랑디플로라 (Grandiflora One)</option>
      <option value="'Nanum Pen Script', cursive">나눔손글씨 펜 (Nanum Pen Script)</option>
      <option value="'Nanum Brush Script', cursive">나눔손글씨 붓 (Nanum Brush Script)</option>
      <option value="'Gaegu', cursive">개구 (Gaegu)</option>

      <option value="'Gamja Flower', cursive">감자꽃 (Gamja Flower)</option>
      <option value="'Noto Sans KR', sans-serif">노토 산스 KR</option>
    </select></label>
    <label>본문 <select id="fontBody">
      <option value="'Noto Sans KR', sans-serif" selected>노토 산스 KR (Noto Sans KR)</option>
      <option value="'Gowun Batang', serif">고운바탕 (Gowun Batang)</option>
      <option value="'Nanum Myeongjo', serif">나눔명조 (Nanum Myeongjo)</option>
      <option value="'Noto Serif KR', serif">노토 세리프 KR</option>
      <option value="'Hahmlet', serif">함렛 (Hahmlet)</option>
      <option value="'Diphylleia', serif">디필레이아 (Diphylleia)</option>
      <option value="'Pretendard', sans-serif">프리텐다드 (Pretendard)</option>
      <option value="'Gowun Dodum', sans-serif">고운돋움 (Gowun Dodum)</option>
    </select></label>
    <label>안내 <select id="fontUi">
      <option value="'Noto Sans KR', sans-serif" selected>노토 산스 KR (Noto Sans KR)</option>
      <option value="'Gowun Dodum', sans-serif">고운돋움 (Gowun Dodum)</option>
      <option value="'Pretendard', sans-serif">프리텐다드 (Pretendard)</option>

      <option value="'IBM Plex Sans KR', sans-serif">IBM Plex Sans KR</option>
    </select></label>
    <div class="fontbar__row">
      <button type="button" id="fontbarHide">패널 닫기</button>
    </div>
  </div>
  <script>
    (function () {
      var root = document.documentElement;

      // 진입 장면(디자인 논의 T36~T40). 화면 크기에서 배율과 카드 값을 계산하고, 봉투 그림이 준비되면 시작합니다. 어디를 탭해도 건너뜁니다.
      // 새로고침해도 맨 위에서 시작합니다(스크롤 복원 끔). 움직임 줄이기 설정이거나 앵커(#…)로 들어오면 바로 커버입니다. 매번 재생합니다
      var introParts = Array.prototype.slice.call(document.querySelectorAll('.intro, .intro-layer'));
      var cover = document.getElementById('cover');
      var introOn = introParts.length > 0;
      var onIntroTap = function () { finishIntro(); };
      var onIntroTouchMove = function (e) { e.preventDefault(); };
      var finishIntro = function () {
        if (!introOn) return;
        introOn = false;
        root.classList.remove('is-intro', 'is-intro-shown');
        introParts.forEach(function (el) { el.remove(); });
        document.removeEventListener('click', onIntroTap);
        document.removeEventListener('touchmove', onIntroTouchMove);
      };
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || location.hash) {
        finishIntro();
      } else if (introOn) {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
        root.classList.add('is-intro');
        var vw = root.clientWidth, vh = window.innerHeight;
        var coverW = cover.clientWidth, coverH = cover.clientHeight;
        var envW = Math.min(vw, 430) * 0.8, z1 = envW / 600, z0 = vh / 400;   // 봉투 폭 = 화면 폭(페이지 폭 430까지)의 80%
        var envTop = vh / 2 - 200 * z1;                  // 전체가 보일 때 봉투 윗변의 화면 y
        var envBottom = envTop + 400 * z1;               // 밑변
        var s0 = (envW * 0.92) / coverW;                 // 카드 폭 = 봉투 폭의 92%
        var ty0 = envTop + 14 * z1;                      // 카드가 봉투 안에 든 자리(윗변 바로 아래)
        var ty1 = (vh - coverH * s0) / 2;                // 올라온 카드의 윗변. 카드가 화면 세로 가운데에 와서 다음 확대가 가운데 기준이 됩니다
        var drop1 = Math.max(0, (ty1 + coverH * s0 * 0.65) - envTop);   // 봉투가 조금 내려가는 거리(화면 px). 카드가 65% 나오도록
        var drop2 = (vh - envTop) + 40;                  // 그다음 화면 아래로 완전히 빠져나가는 거리
        var b0 = coverH - (envBottom - ty0) / s0;        // 봉투 밑변 아래로 삐져나온 카드를 가리는 클립(커버 좌표)
        var b1 = coverH - (envBottom + drop1 - ty1) / s0;   // 올라오기 끝
        var b2 = coverH - (envBottom + drop2 - ty1) / s0;   // 봉투가 빠져나간 뒤(음수 = 클립 없음)
        root.style.setProperty('--z0', z0);
        root.style.setProperty('--z1', z1);
        root.style.setProperty('--drop1', (drop1 / z1) + 'px');
        root.style.setProperty('--drop2', (drop2 / z1) + 'px');
        cover.style.setProperty('--card-s0', s0);
        cover.style.setProperty('--card-ty0', ty0 + 'px');
        cover.style.setProperty('--card-ty1', ty1 + 'px');
        cover.style.setProperty('--card-b0', b0 + 'px');
        cover.style.setProperty('--card-b1', b1 + 'px');
        cover.style.setProperty('--card-b2', b2 + 'px');
        var started = false;
        var startIntro = function () {
          if (started || !introOn) return;
          started = true;
          root.classList.add('is-intro-shown');
          setTimeout(finishIntro, 6500);
        };
        var imgs = [];
        introParts.forEach(function (el) { imgs = imgs.concat(Array.prototype.slice.call(el.querySelectorAll('img'))); });
        Promise.all(imgs.map(function (im) { return im.decode ? im.decode().catch(function () {}) : Promise.resolve(); })).then(startIntro);
        setTimeout(startIntro, 2500);
        cover.addEventListener('animationend', function (e) { if (e.animationName === 'intro-card-grow') finishIntro(); });
        document.addEventListener('click', onIntroTap);
        document.addEventListener('touchmove', onIntroTouchMove, { passive: false });
      }

      var bind = function (id, cssVar) {
        var el = document.getElementById(id);
        el.addEventListener('change', function () { root.style.setProperty(cssVar, el.value + ", 'Apple SD Gothic Neo'"); });
      };
      bind('fontName', '--font-name');
      bind('fontBody', '--font-body');
      bind('fontUi', '--font-ui');
      document.getElementById('fontbarHide').addEventListener('click', function () { document.getElementById('fontbar').hidden = true; });

      var fab = document.getElementById('fab');
      var button = document.getElementById('fabButton');
      var menu = document.getElementById('fabMenu');
      var iconOpen = button.querySelector('.icon-open');
      var iconClose = button.querySelector('.icon-close');
      var setOpen = function (open) {
        fab.dataset.open = open ? 'true' : 'false';
        button.setAttribute('aria-expanded', open ? 'true' : 'false');
        button.setAttribute('aria-label', open ? '메뉴 닫기' : '바로 가기 메뉴');
        iconOpen.style.display = open ? 'none' : '';
        iconClose.style.display = open ? '' : 'none';
        menu.hidden = !open;
      };
      button.addEventListener('click', function () { setOpen(menu.hidden); });
      menu.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(false); });
      document.addEventListener('click', function (e) { if (!fab.contains(e.target)) setOpen(false); });
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setOpen(false); });
    })();
  </script>
