<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=Cormorant+Garamond:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #F3ECDF; }
    a { color: #7E5A33; } a:hover { color: #5C401F; }
  </style>
</helmet>
<div style="width: 390px; height: 1688px; background: #F3ECDF; color: #2F2A25; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; position: relative; overflow: hidden;">

  <section id="cover" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow: hidden;">
    <img src="hall.jpg" alt="더채플앳청담 커티지홀" style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; object-fit: cover; object-position: 50% 50%; display: block; filter: saturate(0.9) contrast(0.97);">
    <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(243, 236, 223, 0.16);"></div>
    <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: radial-gradient(ellipse 72% 60% at 50% 48%, rgba(70, 48, 24, 0) 55%, rgba(70, 48, 24, 0.26) 100%);"></div>
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 30%; background: linear-gradient(180deg, rgba(243, 236, 223, 0.88) 0%, rgba(243, 236, 223, 0.55) 48%, rgba(243, 236, 223, 0) 100%);"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 34%; background: linear-gradient(0deg, rgba(243, 236, 223, 0.92) 0%, rgba(243, 236, 223, 0.6) 48%, rgba(243, 236, 223, 0) 100%);"></div>
    <div style="position: absolute; left: calc(50% + 10px); bottom: 34%; width: 304px; height: 388px; transform: translateX(-50%); background: radial-gradient(ellipse at 50% 70%, rgba(255, 238, 205, 0.55), rgba(255, 238, 205, 0) 65%);"></div>
    <div style="position: absolute; left: calc(50% + 10px); bottom: 29.2%; width: 226px; height: 22px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse at center, rgba(70, 48, 24, 0.38), rgba(70, 48, 24, 0) 68%);"></div>
    <img src="couple.png" alt="이산하와 송시야" style="position: absolute; left: calc(50% + 10px); bottom: 30%; height: 338px; width: auto; transform: translateX(-50%); filter: drop-shadow(0 2px 2px rgba(70, 48, 24, 0.28)) drop-shadow(0 18px 18px rgba(70, 48, 24, 0.18));">
    <div style="position: relative; display: flex; flex-direction: column; align-items: center;">
      <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 20px; font-weight: 500; letter-spacing: 0.34em; text-indent: 0.34em; text-transform: uppercase; color: #7A6F63; line-height: 1.4;">Wedding Invitation</div>
      <div style="width: 26px; height: 1px; margin-top: 12px; background: #B98E5E;"></div>
      <div style="margin-top: 10px; font-family: 'Gowun Batang', 'Apple SD Gothic Neo', serif; font-size: 15px; line-height: 1.7; color: #4A423B;">우리의 삶을 함께 써 주신 당신께</div>
    </div>
    <div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; font-family: 'Gowun Batang', 'Apple SD Gothic Neo', serif;">
      <div style="font-size: 30px; font-weight: 700; letter-spacing: 0.14em; text-indent: 0.14em; line-height: 1.35; color: #2F2A25;">이산하</div>
      <div style="display: flex; align-items: center; gap: 10px; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; font-size: 12px; letter-spacing: 0.1em; color: #7A6F63; line-height: 1.4;"><span style="display: block; width: 18px; height: 1px; background: rgba(185, 142, 94, 0.7);"></span>그리고<span style="display: block; width: 18px; height: 1px; background: rgba(185, 142, 94, 0.7);"></span></div>
      <div style="font-size: 30px; font-weight: 700; letter-spacing: 0.14em; text-indent: 0.14em; line-height: 1.35; color: #2F2A25;">송시야</div>
    </div>
    <button type="button" aria-label="바로 가기 메뉴" style="position: absolute; right: 20px; bottom: 20px; width: 52px; height: 52px; border-radius: 50%; border: 0; padding: 0; background: #B98E5E; color: #FBF7EF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px -8px rgba(70, 48, 24, 0.55); cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><path d="M4 6.5h14M4 11h14M4 15.5h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
    </button>
  </section>

  <section id="info" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 40px 24px; display: flex; align-items: center; justify-content: center;">
    <div style="position: relative; width: 340px; height: 598px;">
      <img src="opened-paper.png" alt="" style="display: block; width: 340px; height: 598px;">
      <div style="position: absolute; left: 22%; right: 22%; top: 13%; height: 46%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; font-size: 16px; line-height: 1.7; color: #4A423B;">
        <div>2026년 10월 9일 금요일</div>
        <div>오후 6시 30분</div>
        <div style="width: 28px; height: 1px; background: #B98E5E; margin: 12px 0;"></div>
        <div style="font-size: 17px; font-weight: 500; color: #2F2A25;">더채플앳청담</div>
        <div>3층 커티지홀</div>
      </div>
    </div>
  </section>
</div>
</x-dc>
</body>
</html>
