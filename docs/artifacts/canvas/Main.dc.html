<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Cormorant+Garamond:wght@500;600&display=swap">
  <style>
    body { margin: 0; background: #F3ECDF; }
    a { color: #7E5A33; } a:hover { color: #5C401F; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F3ECDF; color: #2F2A25; font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif; position: relative; overflow: hidden;">

  <section id="cover" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 52px 24px 56px; display: flex; flex-direction: column; align-items: center;">
    <div style="font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; font-weight: 600; letter-spacing: 0.26em; text-transform: uppercase; color: #7A6F63; line-height: 1.4;">Wedding Invitation</div>
    <div style="margin-top: 10px; font-size: 15px; line-height: 1.7; color: #4A423B;">우리의 삶을 함께 써 주신 당신께</div>

    <div style="position: relative; margin-top: 24px; width: 302px; height: 470px; border-radius: 16px; overflow: hidden; background: #E7DCC8; box-shadow: 0 24px 48px -20px rgba(70, 48, 24, 0.45);">
      <img src="hall.jpg" alt="더채플앳청담 커티지홀" style="width: 100%; height: 100%; object-fit: cover; object-position: 50% 58%; display: block;">
      <div style="position: absolute; left: 50%; bottom: 58px; width: 150px; height: 26px; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(ellipse at center, rgba(70, 48, 24, 0.32), rgba(70, 48, 24, 0) 70%);"></div>
      <img src="couple.png" alt="이산하와 송시야" style="position: absolute; left: 50%; bottom: 66px; transform: translateX(-50%); height: 200px; width: auto; filter: drop-shadow(0 8px 8px rgba(70, 48, 24, 0.3));">
      <div style="position: absolute; left: 0; top: 0; width: 302px; height: 470px; border-radius: 16px; box-shadow: inset 0 0 36px 14px rgba(243, 236, 223, 0.55); pointer-events: none;"></div>
    </div>

    <div style="margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <div style="font-size: 24px; font-weight: 700; letter-spacing: 0.1em; line-height: 1.4;">이산하</div>
      <div style="font-size: 13px; color: #7A6F63; line-height: 1.4;">그리고</div>
      <div style="font-size: 24px; font-weight: 700; letter-spacing: 0.1em; line-height: 1.4;">송시야</div>
    </div>

    <svg width="22" height="12" viewBox="0 0 22 12" fill="none" style="position: absolute; left: 184px; bottom: 72px;" aria-hidden="true"><path d="M2 2 L11 10 L20 2" stroke="#B98E5E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>

    <div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 56px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #FBF7EF; border-top: 1px solid #DCD0BC; font-size: 15px; font-weight: 500;">
      <a href="#directions" style="display: flex; align-items: center; justify-content: center; color: #2F2A25; text-decoration: none; border-right: 1px solid #DCD0BC;">오시는 길</a>
      <a href="#contact" style="display: flex; align-items: center; justify-content: center; color: #2F2A25; text-decoration: none;">연락처</a>
    </div>
  </section>
</div>
</x-dc>
</body>
</html>
