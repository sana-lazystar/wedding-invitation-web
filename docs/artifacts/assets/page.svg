<svg xmlns="http://www.w3.org/2000/svg" width="280" height="405" viewBox="0 0 280 405">
  <!-- 진입 장면 팝업북의 속지. 오른쪽 면, 표지 안쪽 면, 홀 조각 뒷면에 같이 씁니다. 옅은 섬유 결, 세월 얼룩, 갈색 점(foxing), 가장자리 그늘.
       렌더: node docs/scripts/render-asset.mjs docs/artifacts/assets/page.svg public/intro/page.png 1.5 && python3 docs/scripts/quantize-png.py public/intro/page.png -->
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.95 0.95" numOctaves="3" seed="12" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.27  0 0 0 0 0.16  0 0 0 0.11 0" result="grain"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="31" result="m"/>
      <feColorMatrix in="m" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.40  0 0 0 0 0.18  0 0 0 0.09 0" result="mottle"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="mottle"/><feMergeNode in="grain"/></feMerge>
    </filter>
    <filter id="spot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="60%" stop-color="#6B4A26" stop-opacity="0"/>
      <stop offset="100%" stop-color="#6B4A26" stop-opacity="0.12"/>
    </radialGradient>
  </defs>
  <rect width="280" height="405" fill="#FBF6EC" filter="url(#paper)"/>
  <rect width="280" height="405" fill="url(#vig)"/>
  <!-- 갈색 점. 가장자리 쪽에 드문드문 -->
  <g fill="#B98E5E" filter="url(#spot)">
    <circle cx="22" cy="41" r="1.3" opacity="0.16"/>
    <circle cx="257" cy="88" r="0.9" opacity="0.14"/>
    <circle cx="246" cy="331" r="1.6" opacity="0.12"/>
    <circle cx="36" cy="372" r="1.1" opacity="0.15"/>
    <circle cx="61" cy="18" r="0.7" opacity="0.13"/>
    <circle cx="203" cy="392" r="1.0" opacity="0.12"/>
    <circle cx="14" cy="214" r="0.8" opacity="0.14"/>
    <circle cx="268" cy="240" r="1.2" opacity="0.10"/>
    <circle cx="121" cy="9" r="0.6" opacity="0.12"/>
    <circle cx="176" cy="366" r="0.8" opacity="0.11"/>
    <circle cx="240" cy="22" r="0.7" opacity="0.13"/>
    <circle cx="48" cy="300" r="0.6" opacity="0.12"/>
  </g>
</svg>
