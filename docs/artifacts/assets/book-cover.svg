<svg xmlns="http://www.w3.org/2000/svg" width="280" height="405" viewBox="0 0 280 405">
  <!-- 진입 장면 팝업북의 표지(닫힌 책 바깥면). 비율은 조립본의 --leaf-w : --leaf-h = 0.65 : 0.94. 제목 글자는 HTML이 얹으므로 가운데를 비워 둡니다.
       렌더: node docs/scripts/render-asset.mjs docs/artifacts/assets/book-cover.svg public/intro/book-cover.png 1.5 && python3 docs/scripts/quantize-png.py public/intro/book-cover.png -->
  <defs>
    <!-- 천 결(고주파)과 세월 얼룩(저주파) -->
    <filter id="cloth" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.9" numOctaves="3" seed="4" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.30  0 0 0 0 0.22  0 0 0 0 0.12  0 0 0 0.17 0" result="grain"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="9" result="m"/>
      <feColorMatrix in="m" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.28  0 0 0 0 0.10  0 0 0 0.17 0" result="mottle"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="mottle"/><feMergeNode in="grain"/></feMerge>
    </filter>
    <!-- 잉크 번짐. 괘선과 문양에 -->
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feMorphology operator="dilate" radius="0.25"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.1"/>
      <feGaussianBlur stdDeviation="0.18"/>
    </filter>
    <!-- 모서리 닳음: 밝은 얼룩을 흐리게 -->
    <filter id="scuff" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="14"/>
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <radialGradient id="vig" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#3A2810" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3A2810" stop-opacity="0.26"/>
    </radialGradient>
    <linearGradient id="spine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#3A2810" stop-opacity="0.24"/>
      <stop offset="0.45" stop-color="#3A2810" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#3A2810" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FFF6E2" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFF6E2" stop-opacity="0.55"/>
    </linearGradient>
    <!-- 모서리 문양. 안쪽 괘선 모서리에 놓는 작은 장미창 -->
    <g id="corner" fill="#6B4A26" stroke="#6B4A26">
      <circle cx="0" cy="0" r="1.1" stroke="none"/>
      <g fill="none" stroke-width="0.9" stroke-linecap="round">
        <path d="M0 0 c 4 -1, 7 -4, 9 -8 c 1 -2, -2 -3, -3 -1 c -1 2, 2 4, 4 2"/>
        <path d="M0 0 c -1 4, -4 7, -8 9 c -2 1, -3 -2, -1 -3 c 2 -1, 4 2, 2 4"/>
        <path d="M0 0 c 3 3, 6 4, 10 3" stroke-width="0.6"/>
        <path d="M0 0 c 3 3, 4 6, 3 10" stroke-width="0.6"/>
      </g>
    </g>
    <!-- 위아래 가운데 꽃무늬 -->
    <g id="fleuron" fill="none" stroke="#6B4A26" stroke-width="0.9" stroke-linecap="round">
      <path d="M0 -5 l 3.2 5 l -3.2 5 l -3.2 -5 z" fill="#6B4A26" stroke="none"/>
      <path d="M-5 0 c -5 -3, -11 -1, -13 3 c -1 3, 3 4, 4 1 c 1 -3, -3 -4, -4 -1"/>
      <path d="M5 0 c 5 -3, 11 -1, 13 3 c 1 3, -3 4, -4 1 c -1 -3, 3 -4, 4 -1"/>
      <path d="M-5 0 h 3 M5 0 h -3" stroke-width="0.6"/>
    </g>
  </defs>

  <!-- 천 표지 -->
  <rect width="280" height="405" fill="#E2D3B7" filter="url(#cloth)"/>
  <rect width="280" height="405" fill="url(#vig)"/>
  <!-- 닳은 모서리와 가장자리 -->
  <g fill="#F7EFDD" opacity="0.26" filter="url(#scuff)">
    <ellipse cx="276" cy="4" rx="12" ry="7"/>
    <ellipse cx="277" cy="402" rx="13" ry="6"/>
    <ellipse cx="30" cy="404" rx="10" ry="4"/>
    <ellipse cx="279" cy="180" rx="4" ry="60"/>
    <ellipse cx="140" cy="404" rx="70" ry="3"/>
    <ellipse cx="150" cy="1" rx="60" ry="3"/>
  </g>
  <!-- 책등 쪽 그늘과 경첩 홈 -->
  <rect x="0" y="0" width="30" height="405" fill="url(#spine)"/>
  <line x1="10" y1="0" x2="10" y2="405" stroke="#3A2810" stroke-opacity="0.16" stroke-width="1.3"/>
  <line x1="11.6" y1="0" x2="11.6" y2="405" stroke="#FFF6E2" stroke-opacity="0.35" stroke-width="0.7"/>
  <!-- 바깥 가장자리 한 줄 밝음(종이 두께) -->
  <rect x="0.5" y="0.5" width="279" height="404" fill="none" stroke="url(#edge)" stroke-width="1"/>

  <!-- 이중 괘선. 책등 띠(30px)를 빼고 가운데를 맞춥니다. 중심 x = 150 -->
  <g fill="none" stroke="#6B4A26" filter="url(#ink)">
    <rect x="38" y="26" width="224" height="353" stroke-width="1.25" stroke-opacity="0.82"/>
    <rect x="44" y="32" width="212" height="341" stroke-width="0.55" stroke-opacity="0.72"/>
  </g>
  <g filter="url(#ink)" opacity="0.85">
    <use href="#corner" transform="translate(44 32)"/>
    <use href="#corner" transform="translate(256 32) scale(-1 1)"/>
    <use href="#corner" transform="translate(44 373) scale(1 -1)"/>
    <use href="#corner" transform="translate(256 373) scale(-1 -1)"/>
    <use href="#fleuron" transform="translate(150 60)"/>
    <use href="#fleuron" transform="translate(150 345) scale(1 -1)"/>
  </g>
</svg>
