<svg xmlns="http://www.w3.org/2000/svg" width="280" height="405" viewBox="0 0 280 405">
  <!-- 진입 장면 팝업북의 표지(닫힌 책 바깥면). 붉은 가죽에 금박 괘선의 서양 고서. 비율은 조립본의 --leaf-w : --leaf-h = 0.65 : 0.94. 제목 글자는 HTML이 금색으로 얹으므로 가운데를 비워 둡니다.
       렌더: node docs/scripts/render-asset.mjs docs/artifacts/assets/book-cover.svg public/intro/book-cover.png 1.5 && python3 docs/scripts/quantize-png.py public/intro/book-cover.png -->
  <defs>
    <!-- 가죽 결. 노이즈를 요철로 보고 빛을 비춰 자갈결을 내고, 저주파 얼룩을 얹습니다 -->
    <filter id="leather" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="4" seed="7" result="n"/>
      <feDiffuseLighting in="n" surfaceScale="1.7" diffuseConstant="1" lighting-color="#ffffff" result="lit">
        <feDistantLight azimuth="135" elevation="56"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="lit" operator="arithmetic" k1="0.78" k2="0.26" k3="0" k4="0" result="base"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="3" result="m"/>
      <feColorMatrix in="m" type="matrix" values="0 0 0 0 0.10  0 0 0 0 0.02  0 0 0 0 0.02  0 0 0 0.30 0" result="dark"/>
      <feMerge><feMergeNode in="base"/><feMergeNode in="dark"/></feMerge>
    </filter>
    <!-- 금박. 눌린 자국의 그늘과 살짝 번진 가장자리 -->
    <filter id="gild" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="0.7" result="d"/>
      <feDropShadow in="d" dx="0" dy="0.55" stdDeviation="0.35" flood-color="#2A0A0C" flood-opacity="0.75"/>
    </filter>
    <filter id="scuff" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="21" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="12"/>
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAD48F"/>
      <stop offset="0.45" stop-color="#C69D47"/>
      <stop offset="0.7" stop-color="#E3C77A"/>
      <stop offset="1" stop-color="#B98D3E"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="48%" r="72%">
      <stop offset="45%" stop-color="#1A0406" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1A0406" stop-opacity="0.5"/>
    </radialGradient>
    <linearGradient id="spine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1A0406" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#1A0406" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#1A0406" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE9B0" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#FFE9B0" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFE9B0" stop-opacity="0.06"/>
    </linearGradient>
    <!-- 모서리 문양. 안쪽 괘선 모서리의 작은 덩굴 -->
    <g id="corner" fill="none" stroke="url(#gold)" stroke-width="1" stroke-linecap="round">
      <circle cx="0" cy="0" r="1.3" fill="url(#gold)" stroke="none"/>
      <path d="M0 0 c 4 -1, 7 -4, 9 -8 c 1 -2, -2 -3, -3 -1 c -1 2, 2 4, 4 2"/>
      <path d="M0 0 c -1 4, -4 7, -8 9 c -2 1, -3 -2, -1 -3 c 2 -1, 4 2, 2 4"/>
      <path d="M0 0 c 3 3, 6 4, 10 3" stroke-width="0.6"/>
      <path d="M0 0 c 3 3, 4 6, 3 10" stroke-width="0.6"/>
      <path d="M2 -2 l 2.2 -2.2" stroke-width="0.6"/>
    </g>
    <!-- 위아래 가운데 꽃무늬 -->
    <g id="fleuron" fill="none" stroke="url(#gold)" stroke-width="1" stroke-linecap="round">
      <path d="M0 -5.5 l 3.4 5.5 l -3.4 5.5 l -3.4 -5.5 z" fill="url(#gold)" stroke="none"/>
      <path d="M-5 0 c -5 -3, -11 -1, -13 3 c -1 3, 3 4, 4 1 c 1 -3, -3 -4, -4 -1"/>
      <path d="M5 0 c 5 -3, 11 -1, 13 3 c 1 3, -3 4, -4 1 c -1 -3, 3 -4, 4 -1"/>
      <path d="M-5 0 h 3 M5 0 h -3" stroke-width="0.6"/>
      <circle cx="-20" cy="0.5" r="0.9" fill="url(#gold)" stroke="none"/>
      <circle cx="20" cy="0.5" r="0.9" fill="url(#gold)" stroke="none"/>
    </g>
  </defs>

  <!-- 가죽 -->
  <rect width="280" height="405" fill="#7B2431" filter="url(#leather)"/>
  <rect width="280" height="405" fill="url(#sheen)"/>
  <rect width="280" height="405" fill="url(#vig)"/>
  <!-- 모서리 닳음. 가죽은 닳으면 밝은 갈색이 됩니다 -->
  <g fill="#B0664A" opacity="0.26" filter="url(#scuff)">
    <ellipse cx="277" cy="4" rx="12" ry="7"/>
    <ellipse cx="278" cy="402" rx="13" ry="6"/>
    <ellipse cx="34" cy="404" rx="10" ry="4"/>
    <ellipse cx="279" cy="200" rx="3" ry="70"/>
    <ellipse cx="150" cy="404" rx="80" ry="2.5"/>
  </g>
  <!-- 책등 쪽 그늘과 경첩 홈 -->
  <rect x="0" y="0" width="34" height="405" fill="url(#spine)"/>
  <line x1="11" y1="0" x2="11" y2="405" stroke="#1A0406" stroke-opacity="0.4" stroke-width="1.4"/>
  <line x1="12.8" y1="0" x2="12.8" y2="405" stroke="#D89A8A" stroke-opacity="0.16" stroke-width="0.7"/>

  <!-- 금박 이중 괘선. 책등 띠를 빼고 가운데를 맞춥니다. 중심 x = 150 -->
  <g fill="none" stroke="url(#gold)" filter="url(#gild)">
    <rect x="38" y="26" width="224" height="353" stroke-width="1.7"/>
    <rect x="44.5" y="32.5" width="211" height="340" stroke-width="0.7"/>
  </g>
  <g filter="url(#gild)">
    <use href="#corner" transform="translate(44.5 32.5)"/>
    <use href="#corner" transform="translate(255.5 32.5) scale(-1 1)"/>
    <use href="#corner" transform="translate(44.5 372.5) scale(1 -1)"/>
    <use href="#corner" transform="translate(255.5 372.5) scale(-1 -1)"/>
    <use href="#fleuron" transform="translate(150 62)"/>
    <use href="#fleuron" transform="translate(150 343) scale(1 -1)"/>
  </g>
</svg>
