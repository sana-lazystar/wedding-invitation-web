<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <!-- 밀랍 봉인의 뒷면. 뚜껑이 젖혀진 뒤 뚜껑 끝 둘레로 삐져나와 보이는 부분입니다(디자인 논의 T39). 윤곽은 wax-seal.svg와 같은 일그러뜨림이라 앞면과 같고, 납작한 어두운 밀랍에 잔 결만 있습니다.
       렌더: node docs/scripts/render-asset.mjs docs/artifacts/assets/wax-seal-back.svg public/intro/wax-seal-back.png 6 && python3 docs/scripts/quantize-png.py public/intro/wax-seal-back.png -->
  <defs>
    <filter id="waxBack" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9" result="warpN"/>
      <feDisplacementMap in="SourceGraphic" in2="warpN" scale="7" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feFlood flood-color="#3B2411" result="dark"/>
      <feComposite in="dark" in2="shape" operator="in" result="base"/>
      <!-- 가운데가 조금 밝고 가장자리는 어둡게. 윤곽을 번지게 한 알파를 가운데 밝기로 씁니다 -->
      <feGaussianBlur in="shape" stdDeviation="5" result="soft"/>
      <feComposite in="soft" in2="shape" operator="in" result="inner"/>
      <feFlood flood-color="#5B3A1D" result="mid"/>
      <feComposite in="mid" in2="inner" operator="in" result="midIn"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="4" result="grainN"/>
      <feColorMatrix in="grainN" type="matrix" values="0 0 0 0 0.62  0 0 0 0 0.46  0 0 0 0 0.30  0 0 0 0.14 0" result="grain"/>
      <feComposite in="grain" in2="shape" operator="in" result="grainIn"/>
      <feMerge><feMergeNode in="base"/><feMergeNode in="midIn"/><feMergeNode in="grainIn"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#waxBack)">
    <circle cx="70" cy="70" r="47" fill="#4d4d4d"/>
  </g>
</svg>
