<svg xmlns="http://www.w3.org/2000/svg" width="84" height="84" viewBox="0 0 84 84">
  <!-- 레이스 봉투의 장미 봉인(T77 시안). 밝기 = 높이인 그림을 그리고 빛(오른쪽 위)을 비춰 연한 그레이지 밀랍으로 입힙니다. 가운데 (42,42), 지름 약 62. 뚜껑 끝 (320,226)에 가운데를 맞춰 얹습니다. 렌더 6배 -->
  <defs>
    <radialGradient id="lobe" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#8e8e8e"/><stop offset="0.55" stop-color="#a8a8a8"/><stop offset="0.8" stop-color="#d2d2d2"/><stop offset="0.92" stop-color="#ececec"/><stop offset="1" stop-color="#606060"/></radialGradient>
    <filter id="wax" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="9" result="warpN"/>
      <feDisplacementMap in="SourceGraphic" in2="warpN" scale="2" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <feColorMatrix in="shape" type="luminanceToAlpha" result="hRaw"/>
      <feGaussianBlur in="hRaw" stdDeviation="0.9" result="hSoft"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="2" seed="4" result="grainN"/>
      <feComposite in="hSoft" in2="grainN" operator="arithmetic" k2="1" k3="0.04" result="h"/>
      <feDiffuseLighting in="h" surfaceScale="3.6" diffuseConstant="1" lighting-color="#ffffff" result="diff"><feDistantLight azimuth="315" elevation="50"/></feDiffuseLighting>
      <feSpecularLighting in="h" surfaceScale="3.6" specularConstant="0.14" specularExponent="6" lighting-color="#FFFFFF" result="spec"><feDistantLight azimuth="315" elevation="40"/></feSpecularLighting>
      <feFlood flood-color="#DAD4C8" result="col"/>
      <feComposite in="col" in2="shape" operator="in" result="colIn"/>
      <feComposite in="colIn" in2="diff" operator="arithmetic" k1="0.46" k2="0.6" k3="0" k4="0" result="lit"/>
      <feComposite in="spec" in2="lit" operator="arithmetic" k2="0.8" k3="1" k4="0" result="shiny"/>
      <feComposite in="shiny" in2="shape" operator="in" result="sealG"/>
      <feGaussianBlur in="shape" stdDeviation="2.2" result="shB"/>
      <feFlood flood-color="#4A4036" flood-opacity="0.32" result="shC"/>
      <feComposite in="shC" in2="shB" operator="in" result="sh"/>
      <feOffset in="sh" dx="-1.4" dy="1.8" result="shO"/>
      <feGaussianBlur in="shape" stdDeviation="0.7" result="ctB"/>
      <feFlood flood-color="#4A4036" flood-opacity="0.32" result="ctC"/>
      <feComposite in="ctC" in2="ctB" operator="in" result="ct"/>
      <feOffset in="ct" dx="-0.3" dy="0.8" result="ctO"/>
      <feMerge><feMergeNode in="shO"/><feMergeNode in="ctO"/><feMergeNode in="sealG"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#wax)"><g transform="translate(42 42)">
    <circle r="26" fill="#5a5a5a"/>
    <ellipse cx="0" cy="-16.50" rx="13.50" ry="12.00" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(12.0)"/><ellipse cx="0" cy="-16.50" rx="13.50" ry="12.00" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(72.0)"/><ellipse cx="0" cy="-16.50" rx="13.50" ry="12.00" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(132.0)"/><ellipse cx="0" cy="-16.50" rx="13.50" ry="12.00" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(192.0)"/><ellipse cx="0" cy="-16.50" rx="13.50" ry="12.00" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(252.0)"/><ellipse cx="0" cy="-16.50" rx="13.50" ry="12.00" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(312.0)"/>
    <ellipse cx="0" cy="-10.50" rx="10.50" ry="9.50" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(48.0)"/><ellipse cx="0" cy="-10.50" rx="10.50" ry="9.50" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(120.0)"/><ellipse cx="0" cy="-10.50" rx="10.50" ry="9.50" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(192.0)"/><ellipse cx="0" cy="-10.50" rx="10.50" ry="9.50" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(264.0)"/><ellipse cx="0" cy="-10.50" rx="10.50" ry="9.50" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(336.0)"/>
    <ellipse cx="0" cy="-5.50" rx="7.50" ry="7.00" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(20.0)"/><ellipse cx="0" cy="-5.50" rx="7.50" ry="7.00" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(110.0)"/><ellipse cx="0" cy="-5.50" rx="7.50" ry="7.00" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(200.0)"/><ellipse cx="0" cy="-5.50" rx="7.50" ry="7.00" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(290.0)"/>
    <ellipse cx="0" cy="-2.20" rx="4.60" ry="4.60" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(70.0)"/><ellipse cx="0" cy="-2.20" rx="4.60" ry="4.60" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(190.0)"/><ellipse cx="0" cy="-2.20" rx="4.60" ry="4.60" fill="url(#lobe)" stroke="#6e6e6e" stroke-width="0.8" transform="rotate(310.0)"/>
    <circle r="2.4" fill="#c4c4c4" stroke="#6e6e6e" stroke-width="0.7"/>
  </g></g>
</svg>
