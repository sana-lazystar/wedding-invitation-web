<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <!-- 편지봉투 뒷면. 옆 날개 두 장(바탕)과 그 위에 접혀 올라온 아래 날개. 위 날개는 envelope-flap.svg, 봉인은 wax-seal.svg에 따로 있습니다.
       네 날개의 끝이 가운데(300,200) 부근에서 만나는 서양식 봉투(baronial)입니다. 종이는 아마 짜임(linen)이 있는 아이보리 종이입니다.
       빛은 왼쪽 위에서 옵니다. 렌더: node docs/scripts/render-asset.mjs docs/artifacts/assets/envelope-back.svg public/intro/envelope-back.png 2 && python3 docs/scripts/quantize-png.py public/intro/envelope-back.png -->
  <defs>
    <!-- 아마 짜임. (1) 촘촘한 실 격자를 노이즈로 살짝 흔들어 규칙적인 짜임을 내고, (2) 가로·세로로 긴 결을 요철로 보고 약한 빛을 비춰 실의 굴곡을 냅니다. 그 위에 옅은 세월 얼룩 -->
    <pattern id="threads" width="2.6" height="2.6" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2.6" height="1" fill="#4A3620" fill-opacity="0.06"/>
      <rect x="0" y="0" width="1" height="2.6" fill="#4A3620" fill-opacity="0.06"/>
      <rect x="0" y="1" width="2.6" height="0.5" fill="#FFFDF6" fill-opacity="0.26"/>
      <rect x="1" y="0" width="0.5" height="2.6" fill="#FFFDF6" fill-opacity="0.26"/>
    </pattern>
    <filter id="wobble" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="linen" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.05 0.6" numOctaves="2" seed="11" result="weft"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.6 0.05" numOctaves="2" seed="17" result="warp"/>
      <feComposite in="weft" in2="warp" operator="arithmetic" k2="0.5" k3="0.5" result="weave"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="23" result="fiber"/>
      <feComposite in="weave" in2="fiber" operator="arithmetic" k2="0.85" k3="0.15" result="bump"/>
      <feDiffuseLighting in="bump" surfaceScale="1.3" diffuseConstant="1" lighting-color="#ffffff" result="lit">
        <feDistantLight azimuth="225" elevation="68"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="lit" operator="arithmetic" k1="0.92" k2="0.14" k3="0" k4="0" result="base"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="5" result="m"/>
      <feColorMatrix in="m" type="matrix" values="0 0 0 0 0.46  0 0 0 0 0.34  0 0 0 0 0.19  0 0 0 0.08 0" result="mottle"/>
      <feMerge><feMergeNode in="base"/><feMergeNode in="mottle"/></feMerge>
    </filter>
    <!-- 날개가 아래 종이에 드리우는 그늘. 가장자리 전체에 고르게 번지는 그늘 + 빛 반대쪽(오른쪽 아래)으로 치우친 그늘 -->
    <filter id="flapShadow" x="-4%" y="-8%" width="108%" height="116%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="amb"/>
      <feFlood flood-color="#4A3620" flood-opacity="0.30" result="ambC"/>
      <feComposite in="ambC" in2="amb" operator="in" result="ambS"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.3" result="dir"/>
      <feOffset in="dir" dx="1.2" dy="2.6" result="dirO"/>
      <feFlood flood-color="#4A3620" flood-opacity="0.34" result="dirC"/>
      <feComposite in="dirC" in2="dirO" operator="in" result="dirS"/>
      <feMerge><feMergeNode in="ambS"/><feMergeNode in="dirS"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="body"><rect x="0" y="0" width="600" height="400" rx="3"/></clipPath>
    <!-- 아래 날개. 끝은 살짝 둥글고 위 날개·봉인 밑으로 들어갑니다 -->
    <clipPath id="bottomFlap"><path d="M0 400 L296.5 177.6 Q300 175 303.5 177.6 L600 400 Z"/></clipPath>
    <!-- 접힌 곳(가장자리)으로 갈수록 살짝 어두워집니다. 종이가 접히며 약간 굽는 느낌 -->
    <linearGradient id="foldLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A3620" stop-opacity="0.13"/><stop offset="1" stop-color="#4A3620" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foldRight" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#4A3620" stop-opacity="0.13"/><stop offset="1" stop-color="#4A3620" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="foldBottom" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#4A3620" stop-opacity="0.17"/><stop offset="1" stop-color="#4A3620" stop-opacity="0"/>
    </linearGradient>
    <!-- 전체 빛. 왼쪽 위가 밝고 오른쪽 아래가 어둡습니다 -->
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCF4" stop-opacity="0.22"/><stop offset="0.5" stop-color="#FFFCF4" stop-opacity="0"/><stop offset="1" stop-color="#4A3620" stop-opacity="0.09"/>
    </linearGradient>
  </defs>

  <!-- 1. 옆 날개 두 장. 바탕 전체를 채우고 가운데(x=300)에서 만납니다 -->
  <g clip-path="url(#body)">
    <rect width="600" height="400" fill="#EFE6D4" filter="url(#linen)"/>
        <rect width="600" height="400" fill="url(#threads)" filter="url(#wobble)"/>
    <rect width="600" height="400" fill="url(#light)"/>
    <rect x="0" y="0" width="60" height="400" fill="url(#foldLeft)"/>
    <rect x="540" y="0" width="60" height="400" fill="url(#foldRight)"/>
    <!-- 옆 날개 두 장이 만나는 세로 틈. 위·아래 날개에 덮여 봉인 밑에서만 살짝 보입니다 -->
    <line x1="300" y1="0" x2="300" y2="400" stroke="#4A3620" stroke-opacity="0.18" stroke-width="0.8"/>
    <line x1="300.9" y1="0" x2="300.9" y2="400" stroke="#FFFDF6" stroke-opacity="0.5" stroke-width="0.6"/>
  </g>

  <!-- 2. 아래 날개. 옆 날개 위에 접혀 올라와 있고 가장자리에 그늘이 집니다 -->
  <g clip-path="url(#body)">
    <g filter="url(#flapShadow)">
      <g clip-path="url(#bottomFlap)">
        <rect width="600" height="400" fill="#EFE6D4" filter="url(#linen)"/>
        <rect width="600" height="400" fill="url(#threads)" filter="url(#wobble)"/>
        <rect width="600" height="400" fill="url(#light)"/>
        <rect x="0" y="340" width="600" height="60" fill="url(#foldBottom)"/>
      </g>
    </g>
    <!-- 잘린 종이 가장자리가 빛을 받는 선. 날개 안쪽으로 반만 보이게 -->
    <g clip-path="url(#bottomFlap)">
      <path d="M0 400 L296.5 177.6 Q300 175 303.5 177.6 L600 400" fill="none" stroke="#FFFDF6" stroke-opacity="0.6" stroke-width="1.4"/>
    </g>
  </g>
</svg>
