<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
<!-- 쪽지·메모지 종이(디자인 논의 T51 · T53 흰색 · T144 결 강화). 흰 종이에 결과 옅은 얼룩. 바탕(크림색) 위에서 종이가 도드라집니다. 그늘·모서리는 CSS가 맡고(크기가 제각각이라) 이 그림은 object-fit: cover로 깔립니다. 글자는 HTML로 얹습니다.
     결은 T144에 크게 손봤습니다. 처음에는 무늬 간격이 1px이라 화면에 깔릴 때 뭉개지고 밝은 쪽이 흰색에서 잘려, 폰에서 결이 보이지 않았습니다(화면에서 잰 밝기 흔들림 0.3~0.6). 무늬를 3배 넓히고(baseFrequency 1.1 → 0.367) 요철을 깊게(surfaceScale 0.5 → 1.85) 하고 기울기를 키워(0.22 → 0.4, 절편은 평균이 그대로이게) 2.6까지 올렸습니다. 4배도 세기는 같았고 알갱이만 굵어 3배로 정했습니다. -->
<defs>
  <filter id="tooth" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.3667" numOctaves="3" seed="5" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="1.85" diffuseConstant="1" lighting-color="#fff" result="l">
      <feDistantLight azimuth="225" elevation="56"/>
    </feDiffuseLighting>
    <feComponentTransfer in="l" result="soft">
      <feFuncR type="linear" slope="0.4" intercept="0.637"/>
      <feFuncG type="linear" slope="0.4" intercept="0.637"/>
      <feFuncB type="linear" slope="0.4" intercept="0.637"/>
    </feComponentTransfer>
    <feComposite in="soft" in2="SourceAlpha" operator="in" result="t"/>
    <feBlend in="SourceGraphic" in2="t" mode="multiply"/>
  </filter>
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="11"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.50  0 0 0 0 0.42  0 0 0 0.09 0"/>
  </filter>
  <linearGradient id="vig" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FAF8F3"/>
  </linearGradient>
</defs>
<rect width="720" height="480" fill="url(#vig)" filter="url(#tooth)"/>
<rect width="720" height="480" filter="url(#mottle)"/>
</svg>
