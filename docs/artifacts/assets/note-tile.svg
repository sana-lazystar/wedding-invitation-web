<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
<!-- 종이 결 타일(디자인 논의 T145). 종이마다 그림을 늘려 깔던 것을 고정 크기로 이어 붙이도록 바꾸면서 만들었습니다.
     전에는 한 장(note-paper.svg 720×480)을 object-fit: cover로 깔아, 종이 상자 크기에 따라 결이 0.36배(작은 쪽지)에서 1.83배(긴 종이 한 장)까지 달라 보였습니다.
     이 타일은 이산하가 고른 하객 안내 종이의 결을 그대로 재현합니다. 그때 배율이 0.664였으므로 480px 타일을 319px(480 × 0.664)로 깔면 같은 크기가 됩니다.
     결의 값과 필터 구성은 note-paper.svg와 같습니다(무늬 0.3667 · 요철 1.85 · 기울기 0.4 · 절편 0.637 · 얼룩 0.09). 색공간도 기본값(linearRGB) 그대로 두어야 세기가 같습니다. sRGB로 두면 두 배로 진해집니다.
     다른 점은 둘입니다. (1) 이어 붙여도 이음매가 없도록 두 노이즈에 stitchTiles="stitch". (2) 종이 바탕의 옅은 그러데이션(흰색 → 크림)은 굽지 않고 CSS가 깝니다. 타일은 흰 바탕에 결만 있고 CSS가 multiply로 얹습니다.
     렌더: node docs/scripts/render-asset.mjs docs/artifacts/assets/note-tile.svg public/paper/note-tile.png 1 && python3 docs/scripts/quantize-png.py public/paper/note-tile.png -->
<defs>
  <filter id="tooth" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.3667" numOctaves="3" seed="5" stitchTiles="stitch" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="1.85" diffuseConstant="1" lighting-color="#fff" result="l">
      <feDistantLight azimuth="225" elevation="56"/>
    </feDiffuseLighting>
    <feComponentTransfer in="l" result="soft">
      <feFuncR type="linear" slope="0.4" intercept="0.637"/>
      <feFuncG type="linear" slope="0.4" intercept="0.637"/>
      <feFuncB type="linear" slope="0.4" intercept="0.637"/>
    </feComponentTransfer>
    <feComposite in="soft" in2="SourceAlpha" operator="in" result="t"/>
    <feBlend in="SourceGraphic" in2="t" mode="multiply"/>
  </filter>
  <filter id="mottle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.50  0 0 0 0 0.42  0 0 0 0.09 0"/>
  </filter>
</defs>
<rect width="480" height="480" fill="#FFFFFF" filter="url(#tooth)"/>
<rect width="480" height="480" filter="url(#mottle)"/>
</svg>
