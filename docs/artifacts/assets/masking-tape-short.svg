<svg xmlns="http://www.w3.org/2000/svg" width="120" height="48" viewBox="0 0 120 48">
<!-- 짧은 마스킹테이프(디자인 논의 T105). 추신 테이프(masking-tape.svg)와 같은 결·색이고 길이만 120이라, 뷰어 인화지 위 가운데에 76px 폭으로 놓으면 두께 30px이 됩니다 -->
<defs>
  <filter id="fiber" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03 0.55" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0.18 0" result="f"/>
    <feComposite in="f" in2="SourceAlpha" operator="in" result="ft"/>
    <feBlend in="SourceGraphic" in2="ft" mode="multiply"/>
  </filter>
</defs>
<polygon points="6,4 114,3 117,9 113,14 118,20 113,26 117,33 112,39 116,45 8,44 4,39 9,33 3,26 8,20 3,14 7,9" fill="#E8CFC3" fill-opacity="0.72" filter="url(#fiber)"/>
<rect x="10" y="6" width="100" height="3" fill="#fff" fill-opacity="0.18"/>
</svg>
