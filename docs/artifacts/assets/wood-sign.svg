<svg xmlns="http://www.w3.org/2000/svg" width="240" height="64" viewBox="0 0 240 64">
<!-- 사진첩 표지판(디자인 논의 T106). 나무 틀(wood-frame.svg)과 같은 결 · 색 · 거친 가장자리의 널빤지 한 장. 틀 위 널빤지에 아래쪽이 조금 겹치게 세워 붙이고, 아래 두 못이 그 겹침 자리에 옵니다. "사진첩" 글자는 HTML로 얹습니다(그림에 글자를 넣지 않습니다). CSS가 틀 폭의 36%로 놓고 -1.5° 기울입니다. -->
<defs>
  <filter id="grainH" x="-3%" y="-10%" width="106%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.014 0.42" numOctaves="3" seed="21" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.38  0 0 0 0 0.24  0 0 0 0 0.11  0 0 0 0.42 0" result="g"/>
    <feComposite in="g" in2="SourceAlpha" operator="in" result="gt"/>
    <feBlend in="SourceGraphic" in2="gt" mode="multiply" result="wood"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="17" result="edge"/>
    <feDisplacementMap in="wood" in2="edge" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <linearGradient id="bevelH" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="0.14" stop-color="#FFFFFF" stop-opacity="0"/>
    <stop offset="0.86" stop-color="#3A2612" stop-opacity="0"/><stop offset="1" stop-color="#3A2612" stop-opacity="0.22"/>
  </linearGradient>
  <radialGradient id="knot" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#7A5836" stop-opacity="0.5"/><stop offset="0.55" stop-color="#8E6A42" stop-opacity="0.3"/><stop offset="1" stop-color="#8E6A42" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="nail" cx="0.35" cy="0.35" r="0.65">
    <stop offset="0" stop-color="#A08468"/><stop offset="0.6" stop-color="#6A4F35"/><stop offset="1" stop-color="#4A3524"/>
  </radialGradient>
</defs>
<g transform="rotate(0.3 120 32)">
  <rect x="4" y="4" width="232" height="56" rx="2" fill="#CFAA79" filter="url(#grainH)"/>
  <rect x="4" y="4" width="232" height="56" rx="2" fill="url(#bevelH)"/>
  <ellipse cx="206" cy="20" rx="7" ry="3.2" fill="url(#knot)"/>
  <ellipse cx="30" cy="44" rx="5" ry="2.4" fill="url(#knot)"/>
</g>
<!-- 못. 아래 양 끝, 틀 위 널빤지와 겹치는 자리 -->
<circle cx="18" cy="54" r="2.4" fill="url(#nail)"/>
<circle cx="222" cy="54" r="2.4" fill="url(#nail)"/>
</svg>
