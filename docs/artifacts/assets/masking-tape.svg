<svg xmlns="http://www.w3.org/2000/svg" width="200" height="48" viewBox="0 0 200 48">
<!-- 마스킹테이프(디자인 논의 T102). 추신 쪽지를 바탕에 붙이는 반투명 종이테이프. 양 끝은 뜯은 자국, 결은 가로 섬유, 색은 옅은 분홍 베이지. 아래 종이가 비쳐야 하므로 불투명도 0.72. CSS가 72px 폭으로 놓고 살짝 기울입니다 -->
<defs>
  <filter id="fiber" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03 0.55" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0.18 0" result="f"/>
    <feComposite in="f" in2="SourceAlpha" operator="in" result="ft"/>
    <feBlend in="SourceGraphic" in2="ft" mode="multiply"/>
  </filter>
</defs>
<polygon points="6,4 194,3 197,9 193,14 198,20 193,26 197,33 192,39 196,45 8,44 4,39 9,33 3,26 8,20 3,14 7,9" fill="#E8CFC3" fill-opacity="0.72" filter="url(#fiber)"/>
<rect x="10" y="6" width="180" height="3" fill="#fff" fill-opacity="0.18"/>
</svg>
