<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140">
  <!-- 밀랍 봉인. 청동빛 밀랍이 둥글게 퍼지고 가운데에 도장이 눌려 테두리·글자가 도드라집니다.
       그리는 법: 회색 그림을 높이 지도로 씁니다(밝을수록 높음). 낮은 주파수 노이즈로 살짝 일그러뜨려 손으로 찍은 느낌을 내고, 그 요철에 빛(왼쪽 위)을 비춰 명암과 광택을 얻은 뒤 밀랍 색을 입힙니다.
       봉인 지름 약 84px(퍼진 밀랍까지 약 92px). 가운데 (70,70). 종이에 드리우는 그늘은 굽습니다(봉인이 떼일 때 같이 움직이도록).
       글자는 도장 자국이라 PNG에 굽습니다(HTML 글꼴 규칙의 예외). 렌더: node docs/scripts/render-asset.mjs docs/artifacts/assets/wax-seal.svg public/intro/wax-seal.png 3 && python3 docs/scripts/quantize-png.py public/intro/wax-seal.png -->
  <defs>
    <filter id="wax" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <!-- 1. 일그러뜨림. 퍼진 밀랍의 가장자리가 울퉁불퉁해집니다 -->
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="9" result="warpN"/>
      <feDisplacementMap in="SourceGraphic" in2="warpN" scale="7" xChannelSelector="R" yChannelSelector="G" result="shape"/>
      <!-- 2. 높이 지도. 밝기를 높이로 옮기고 둥글게 깎은 뒤 밀랍 결(잔 노이즈)을 더합니다 -->
      <feColorMatrix in="shape" type="luminanceToAlpha" result="hRaw"/>
      <feGaussianBlur in="hRaw" stdDeviation="0.8" result="hSoft"/>
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="4" result="grainN"/>
      <feComposite in="hSoft" in2="grainN" operator="arithmetic" k2="1" k3="0.05" result="h"/>
      <!-- 3. 빛. 명암과 광택 -->
      <feDiffuseLighting in="h" surfaceScale="6" diffuseConstant="1.05" lighting-color="#ffffff" result="diff">
        <feDistantLight azimuth="225" elevation="46"/>
      </feDiffuseLighting>
      <feSpecularLighting in="h" surfaceScale="6" specularConstant="1.0" specularExponent="26" lighting-color="#FFDDA8" result="spec">
        <feDistantLight azimuth="225" elevation="38"/>
      </feSpecularLighting>
      <!-- 4. 밀랍 색을 입히고 명암을 곱한 뒤 광택을 더합니다. 모양 밖은 잘라냅니다 -->
      <feFlood flood-color="#7C4B22" result="col"/>
      <feComposite in="col" in2="shape" operator="in" result="colIn"/>
      <feComposite in="colIn" in2="diff" operator="arithmetic" k1="1" k2="0" k3="0" k4="0" result="lit"/>
      <feComposite in="spec" in2="lit" operator="arithmetic" k2="0.9" k3="1" k4="0" result="shiny"/>
      <feComposite in="shiny" in2="shape" operator="in" result="seal"/>
      <!-- 5. 종이에 드리우는 그늘 -->
      <feGaussianBlur in="shape" stdDeviation="2.4" result="shB"/>
      <feFlood flood-color="#3A2410" flood-opacity="0.42" result="shC"/>
      <feComposite in="shC" in2="shB" operator="in" result="sh"/>
      <feOffset in="sh" dx="1.2" dy="2.6" result="shO"/>
      <feGaussianBlur in="shape" stdDeviation="0.8" result="ctB"/>
      <feFlood flood-color="#3A2410" flood-opacity="0.35" result="ctC"/>
      <feComposite in="ctC" in2="ctB" operator="in" result="ct"/>
      <feOffset in="ct" dx="0.3" dy="0.9" result="ctO"/>
      <feMerge><feMergeNode in="shO"/><feMergeNode in="ctO"/><feMergeNode in="seal"/></feMerge>
    </filter>
  </defs>
  <!-- 높이 지도 그림. 밝기 = 높이. 바깥으로 퍼진 얇은 밀랍(낮음) → 도장 테두리(높음) → 도장 면(중간) → 글자·구슬 테(가장 높음) -->
  <g filter="url(#wax)">
    <circle cx="70" cy="70" r="47" fill="#4d4d4d"/>
    <circle cx="70" cy="70" r="39" fill="#6a6a6a"/>
    <circle cx="70" cy="70" r="37.5" fill="#d9d9d9"/>
    <circle cx="70" cy="70" r="32.5" fill="#8a8a8a"/>
    <!-- 구슬 테 -->
    <g fill="#f0f0f0">
      <circle cx="70" cy="42" r="1.1"/><circle cx="84" cy="45.8" r="1.1"/><circle cx="94.2" cy="56" r="1.1"/><circle cx="98" cy="70" r="1.1"/>
      <circle cx="94.2" cy="84" r="1.1"/><circle cx="84" cy="94.2" r="1.1"/><circle cx="70" cy="98" r="1.1"/><circle cx="56" cy="94.2" r="1.1"/>
      <circle cx="45.8" cy="84" r="1.1"/><circle cx="42" cy="70" r="1.1"/><circle cx="45.8" cy="56" r="1.1"/><circle cx="56" cy="45.8" r="1.1"/>
      <circle cx="77.2" cy="43" r="1.1"/><circle cx="89.8" cy="50.2" r="1.1"/><circle cx="97" cy="62.8" r="1.1"/><circle cx="97" cy="77.2" r="1.1"/>
      <circle cx="89.8" cy="89.8" r="1.1"/><circle cx="77.2" cy="97" r="1.1"/><circle cx="62.8" cy="97" r="1.1"/><circle cx="50.2" cy="89.8" r="1.1"/>
      <circle cx="43" cy="77.2" r="1.1"/><circle cx="43" cy="62.8" r="1.1"/><circle cx="50.2" cy="50.2" r="1.1"/><circle cx="62.8" cy="43" r="1.1"/>
    </g>
    <!-- 도장 글자. 두 사람 이름 첫 글자 -->
    <g fill="#f4f4f4" font-family="Baskerville" font-style="italic" text-anchor="middle">
      <text x="55" y="81" font-size="34">S</text>
      <text x="70" y="79" font-size="14" font-style="normal">&amp;</text>
      <text x="86" y="81" font-size="34">S</text>
    </g>
    <!-- 위아래 작은 마름모 -->
    <g fill="#f0f0f0">
      <path d="M70 47 l3 3.6 l-3 3.6 l-3 -3.6 z"/>
      <path d="M70 85.8 l3 3.6 l-3 3.6 l-3 -3.6 z"/>
    </g>
  </g>
</svg>
