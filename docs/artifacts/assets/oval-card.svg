<svg xmlns="http://www.w3.org/2000/svg" width="840" height="1110" viewBox="0 0 840 1110">
<!-- 타원 카드(고운 결 무명 종이 + 인쇄된 두 겹 테두리). 글자는 HTML로 얹는다.
     레이스 프릴 PNG와 같은 840×1110 화폭이라 같은 자리에 겹쳐 놓으면 맞는다. -->
<defs>
  <filter id="tooth" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="1.25" numOctaves="2" seed="3" result="n"/>
    <feDiffuseLighting in="n" surfaceScale="0.55" diffuseConstant="1" lighting-color="#fff" result="l">
      <feDistantLight azimuth="225" elevation="64"/>
    </feDiffuseLighting>
    <feComponentTransfer in="l" result="soft">
      <feFuncR type="linear" slope="0.3" intercept="0.7"/>
      <feFuncG type="linear" slope="0.3" intercept="0.7"/>
      <feFuncB type="linear" slope="0.3" intercept="0.7"/>
    </feComponentTransfer>
    <feComposite in="soft" in2="SourceAlpha" operator="in" result="t"/>
    <feBlend in="SourceGraphic" in2="t" mode="multiply"/>
  </filter>
  <radialGradient id="vig" cx="0.42" cy="0.34" r="0.8">
    <stop offset="0" stop-color="#FCF7EC"/><stop offset="0.6" stop-color="#F5EFE1"/>
    <stop offset="1" stop-color="#EDE5D4"/>
  </radialGradient>
  <filter id="lift" x="-12%" y="-10%" width="124%" height="120%">
    <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#8F8069" flood-opacity="0.42"/>
    <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#7B6C57" flood-opacity="0.28"/>
  </filter>
</defs>
<g filter="url(#lift)">
  <ellipse cx="420" cy="555" rx="225" ry="345" fill="url(#vig)" filter="url(#tooth)"/>
  <ellipse cx="420" cy="555" rx="224.3" ry="344.3" fill="none" stroke="#FFFDF7" stroke-width="1.5" stroke-opacity="0.7"/>
  <ellipse cx="420" cy="555" rx="194" ry="313" fill="none" stroke="#A08A69" stroke-width="1.6" stroke-opacity="0.85"/>
  <ellipse cx="420" cy="555" rx="185" ry="304" fill="none" stroke="#A08A69" stroke-width="0.9" stroke-opacity="0.65"/>
</g>
</svg>
